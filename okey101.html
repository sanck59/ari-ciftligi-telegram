<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>101 Okey</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%;color:#fff0cf;font-family:-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden;background:#1d3b2a}
body{background:radial-gradient(circle at 50% 0,#2f7a4a 0,#1a4a2e 50%,#0d2818 100%) fixed}
#app{max-width:480px;margin:0 auto;padding:10px 10px 28px}
h2{margin:4px 0 8px;text-align:center;font-size:22px;font-weight:900;color:#ffd54a;text-shadow:0 2px 0 #7a4a00}
.panel{background:rgba(10,30,18,.7);border:1.5px solid #c9964a;border-radius:16px;padding:10px;margin-bottom:10px}
.btn{background:linear-gradient(#ffe27a,#f0a81c);color:#3b2406;border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;margin:3px 3px 3px 0;box-shadow:0 3px 0 #9a6410}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6410}
.btn.ikincil{background:transparent;color:#fff0cf;border:1px solid #c9964a;box-shadow:none}
.btn.tehlike{background:transparent;color:#ff8a65;border:1px solid #ff8a65;box-shadow:none}
.btn:disabled{opacity:.4}
.muted{color:#cfe6d6;font-size:12px}
.satir{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.satir:last-child{border-bottom:0}.grow{flex:1;min-width:0}
.gizle{display:none}
.bant{padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.3);font-size:13px;text-align:center;margin-bottom:8px}
.bant.sira{background:rgba(255,213,74,.22);color:#ffd54a;font-weight:800}

/* Oyuncular */
.oyuncular{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.oy{background:rgba(0,0,0,.3);border:1.5px solid #3f7a57;border-radius:12px;padding:6px 8px;font-size:12px;min-width:0}
.oy.sira{border-color:#ffd54a;box-shadow:0 0 10px rgba(255,213,74,.5)}
.oy b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oy span{color:#cfe6d6}

/* Gösterge, deste, atılan */
.orta{display:flex;gap:14px;justify-content:center;align-items:flex-start;margin:6px 0 4px}
.kutu{text-align:center;font-size:11px;color:#cfe6d6}
.kutu .ad{margin-bottom:3px}
.mini{width:44px;margin:0 auto}
.yigin{width:50px;height:70px;border-radius:9px;background:repeating-linear-gradient(45deg,#7a1d9c,#7a1d9c 6px,#5a1278 6px,#5a1278 12px);border:2px solid #ffd54a;display:flex;align-items:center;justify-content:center;color:#ffd54a;font-weight:900;font-size:16px;margin:0 auto}
.cekilebilir{cursor:pointer;animation:zt 1s ease-in-out infinite alternate}
@keyframes zt{from{transform:scale(1)}to{transform:scale(1.07);filter:drop-shadow(0 0 8px #ffd54a)}}
.okey-bilgi{text-align:center;font-size:12px;color:#ffe9a8;margin:4px 0 2px;font-weight:700}

/* Taşlar */
.tas{position:relative;width:100%;aspect-ratio:3/4.2;border-radius:6px;background:linear-gradient(#fffdf4,#f1e6c4);border-bottom:4px solid #cdb989;box-shadow:0 3px 4px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#222}
.tas .n{font-size:clamp(12px,4.4vw,19px);line-height:1}
.tas .d{width:34%;aspect-ratio:1;border-radius:50%;border:2px solid currentColor;margin-top:2px}
.tas.k{color:#d6322b}.tas.s{color:#d98f00}.tas.m{color:#1f6fd1}.tas.z{color:#1b1b1b}
.tas.sahte{color:#2a9a54;background:linear-gradient(#f2fff4,#cdeed6)}
.tas.okey{box-shadow:0 3px 4px rgba(0,0,0,.5),0 0 0 2px #ffd54a}
.tas.secili{transform:translateY(-8px);box-shadow:0 0 0 3px #ffd54a,0 8px 12px rgba(0,0,0,.5);z-index:3}
.rack{background:linear-gradient(#b07a3c,#8a5a26);border:3px solid #5f3d17;border-radius:14px;padding:8px 6px;box-shadow:inset 0 3px 10px rgba(0,0,0,.45);margin-bottom:6px}
.raf{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:6px 4px;background:linear-gradient(#7a4f20,#9a6a30);border-radius:8px;margin:3px 0;min-height:72px}
.slot{position:relative;aspect-ratio:3/4.2;border-radius:6px;background:rgba(0,0,0,.2);box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.gruplar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.grup{display:flex;gap:2px;align-items:center;background:rgba(0,0,0,.25);border:1px dashed #c9964a;border-radius:10px;padding:4px}
.grup .tas{width:30px}
.grup button{margin-left:4px;padding:4px 6px;font-size:11px}
.ipucu{font-size:12px;text-align:center;color:#cfe6d6;margin:6px 0;min-height:16px}
.aksiyon{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
#bit{text-align:center;padding:14px;margin-bottom:10px;border-radius:16px;background:linear-gradient(#ffe27a,#f0a81c);color:#3b2406;font-weight:900;font-size:16px}
#hata{color:#ffb199;font-size:13px;min-height:18px;text-align:center}
#bilgi{color:#9be36b;font-size:13px;min-height:18px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <h2>🃏 101 Okey</h2>
  <div id="lobi">
    <div class="panel">
      <div class="muted">Bu odadaki masalar</div>
      <div id="masalar"></div>
      <button class="btn ikincil" onclick="lobiYukle()">↻ Yenile</button>
      <div style="margin-top:8px">
        <button class="btn" onclick="masaAc(2)">2 kişilik aç</button>
        <button class="btn" onclick="masaAc(3)">3 kişilik aç</button>
        <button class="btn" onclick="masaAc(4)">4 kişilik aç</button>
      </div>
    </div>
  </div>

  <div id="masa" class="gizle">
    <div id="bit" class="gizle"></div>
    <div class="panel">
      <div id="baslik" style="text-align:center;font-weight:800"></div>
      <div id="oyuncular" class="oyuncular"></div>
      <div id="bant" class="bant"></div>
    </div>

    <div class="panel">
      <div class="orta">
        <div class="kutu"><div class="ad">Gösterge</div><div class="mini" id="gosterge"></div></div>
        <div class="kutu"><div class="ad">Deste <span id="deste">0</span></div><div class="yigin" id="yigin" onclick="cek('deste')">?</div></div>
        <div class="kutu"><div class="ad">Atılan</div><div class="mini" id="atilan" onclick="cek('atilan')"></div></div>
      </div>
      <div class="okey-bilgi" id="okeyBilgi"></div>
    </div>

    <div class="panel">
      <div class="rack" id="rack"></div>
      <div class="ipucu" id="ipucu"></div>
      <div class="muted" style="text-align:center;margin-bottom:4px">Masadaki gruplar</div>
      <div class="gruplar" id="masaGruplar"></div>
      <div class="muted" style="text-align:center;margin:6px 0 4px">Hazırladığın gruplar</div>
      <div class="gruplar" id="gruplar"></div>
      <div class="aksiyon" style="margin-top:8px" id="aksiyon"></div>
    </div>

    <div class="panel">
      <div class="aksiyon">
        <button class="btn ikincil" onclick="lobiyeDon()">← Masalara dön</button>
        <button class="btn tehlike" onclick="ayrilOyun()">Oyundan ayrıl</button>
      </div>
    </div>
  </div>
  <div id="bilgi"></div>
  <div id="hata"></div>
</div>

<script>
// Oturum bilgisi uygulamadan biraz geç gelebilir; her çağrıda yeniden okunur
let CFG = null;
function cfgAl() { if (!CFG) CFG = window.ARI_CIFTLIK || null; return CFG; }
const odaAl = () => window.ARI_ODA || null;

const SINIF = ['k', 's', 'm', 'z'];          // kırmızı, sarı, mavi, siyah
const SEMBOL = ['♦', '●', '♣', '♠'];
let masaId = null, masa = null, timer = null, kilit = false;
let secili = [];        // elde seçilen taşlar (id)
let grupTaslak = [];    // henüz gönderilmemiş gruplar (id dizileri)
let sonTur = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hata(m) { $('hata').textContent = m || ''; }
function bilgi(m) { $('bilgi').textContent = m || ''; clearTimeout(bilgi._t); bilgi._t = setTimeout(() => $('bilgi').textContent = '', 2600); }

async function rpc(ad, body) {
  if (!cfgAl()) throw new Error('Oturum yok. Oyunu uygulamadan aç.');
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + ad, {
    method: 'POST',
    headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Hata ' + r.status));
  return j;
}
async function tablo(yol) {
  if (!cfgAl()) return [];
  const r = await fetch(CFG.url + '/rest/v1/' + yol, { headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.token } });
  return r.json();
}

/* ---------- Taş kodlaması (sunucuyla aynı) ---------- */
// id 0..103: renk = floor(id/26), sayı = (id%26)%13+1. id 104,105: sahte okey.
const sahteMi = (id) => id >= 104;
const renkOf = (id) => Math.floor(id / 26);
const sayiOf = (id) => (id % 26) % 13 + 1;
const durumJson = () => (masa && masa.durum_json) ? masa.durum_json : {};

// Okey: gösterge taşının aynı renkteki bir üstü (13 → 1). Okey taşları ve sahte okeyler joker.
function okeyMu(id) {
  if (sahteMi(id)) return true;
  const d = durumJson();
  if (d.okey_r === undefined || d.okey_s === undefined) return false;
  return renkOf(id) === d.okey_r && sayiOf(id) === d.okey_s;
}

function tasHtml(id, ek) {
  const cls = (ek || '') + (!sahteMi(id) && okeyMu(id) ? ' okey' : '');
  if (sahteMi(id)) return '<div class="tas sahte ' + cls + '"><div class="n">★</div><div class="d" style="border-color:transparent"></div></div>';
  return '<div class="tas ' + SINIF[renkOf(id)] + ' ' + cls + '"><div class="n">' + sayiOf(id) + '</div><div class="d"></div></div>';
}

/* ---------- Grup kuralları (sunucudaki kuralın aynısı) ---------- */
function grupOk(ids) {
  if (ids.length < 3 || ids.length > 13) return false;
  let k = 0, w = 0;
  const nums = [], cols = [];
  ids.forEach((t) => {
    if (okeyMu(t)) w++;
    else { k++; nums.push(sayiOf(t)); cols.push(renkOf(t)); }
  });
  if (k === 0) return true;
  const dn = new Set(nums).size, dc = new Set(cols).size;
  // aynı sayı, farklı renkler (3-4 taş)
  if (ids.length <= 4 && dn === 1 && dc === k) return true;
  // aynı renk, ardışık sayılar (boşlukları okey taşları doldurur)
  if (dc === 1 && dn === k) {
    const mn = Math.min(...nums), mx = Math.max(...nums);
    if ((mx - mn + 1) - k <= w) return true;
  }
  return false;
}
// El açma puanı: joker, gösterge okeyinin değerini alır
function grupToplam(ids) {
  const d = durumJson();
  return ids.reduce((s, t) => s + (okeyMu(t) ? (d.okey_s || 0) : sayiOf(t)), 0);
}

/* ---------- Lobi ---------- */
async function lobiYukle() {
  hata('');
  const ODA = odaAl();
  if (!ODA) { $('masalar').innerHTML = '<div class="muted">Oda bilgisi alınamadı. Oyunu odadan aç.</div>'; return; }
  const liste = await tablo('oyun_masalari?oda_id=eq.' + ODA + '&oyun=eq.okey101&durum=neq.bitti&select=id,durum,max_oyuncu,sahip_id&order=olusturma.desc');
  if (!Array.isArray(liste) || liste.length === 0) {
    $('masalar').innerHTML = '<div class="muted" style="padding:8px 0">Açık masa yok. Aşağıdan bir masa aç.</div>';
    return;
  }
  const oyuncular = await Promise.all(liste.map((m) => tablo('oyun_masa_oyuncular?masa_id=eq.' + m.id + '&select=kullanici_id')));
  $('masalar').innerHTML = liste.map((m, i) => {
    const n = oyuncular[i].length;
    const icinde = oyuncular[i].some((x) => x.kullanici_id === cfgAl().uid);
    const etiket = m.durum === 'bekliyor' ? (n + '/' + m.max_oyuncu + ' bekliyor') : 'Oynanıyor';
    const bosYok = !icinde && (m.durum === 'oynaniyor' || n >= m.max_oyuncu);
    const buton = bosYok ? '' : '<button class="btn" onclick="girMasa(' + m.id + ')">' + (icinde ? 'Aç' : 'Katıl') + '</button>';
    return '<div class="satir"><div class="grow">🃏 Masa #' + m.id + '<div class="muted">' + etiket + '</div></div>' + buton + '</div>';
  }).join('');
}
async function masaAc(n) {
  hata('');
  try {
    const id = await rpc('masa_ac', { p_oda: odaAl(), p_oyun: 'okey101', p_max: n, p_mod: 'klasik' });
    await girMasa(id);
  } catch (e) { hata(e.message); }
}
async function girMasa(id) {
  hata('');
  try {
    const d = await rpc('masa_durumu', { p_masa: id });
    const icinde = d.oyuncular.some((o) => o.id === cfgAl().uid);
    if (!icinde) {
      if (d.durum !== 'bekliyor') throw new Error('Bu masa oynanıyor');
      await rpc('masa_katil', { p_masa: id });
    }
    masaId = id; secili = []; grupTaslak = []; sonTur = null;
    $('lobi').classList.add('gizle');
    $('masa').classList.remove('gizle');
    await yenile();
    clearInterval(timer);
    timer = setInterval(yenile, 1500);
  } catch (e) { hata(e.message); }
}
function lobiyeDon() {
  clearInterval(timer); timer = null;
  masaId = null; masa = null; secili = []; grupTaslak = []; sonTur = null;
  $('masa').classList.add('gizle');
  $('lobi').classList.remove('gizle');
  lobiYukle();
}
async function ayrilOyun() {
  if (!masaId) return;
  const simdi = Date.now();
  if (!ayrilOyun._t || simdi - ayrilOyun._t > 4000) { ayrilOyun._t = simdi; bilgi('Ayrılmak için bir kez daha dokun'); return; }
  ayrilOyun._t = 0;
  try {
    const s = await rpc('masa_oyun_ortasi_ayril', { p_masa: masaId });
    if (s && s.bitti) bilgi(s.kazanan ? 'Masa bitti, rakip ayrıldı.' : 'Masa kapandı.'); else bilgi('Masadan ayrıldın');
    lobiyeDon();
  } catch (e) { hata(e.message); }
}
async function yenile() {
  if (!masaId) return;
  try { masa = await rpc('masa_durumu', { p_masa: masaId }); render(); }
  catch (e) { hata(e.message); }
}

/* ---------- Durum ---------- */
const benimUid = () => cfgAl().uid;
const benimSira = () => !!masa && masa.durum === 'oynaniyor' && masa.sira_kullanici === benimUid();
const cekildi = () => !!masa && masa.tur_hareket === true;
const acildim = () => !!(durumJson().acildi && durumJson().acildi[benimUid()]);
const elTaslar = () => (masa && masa.el ? masa.el : []);
// Gruba konmamış taşlar
const kalanTaslar = () => elTaslar().filter((t) => !grupTaslak.some((g) => g.includes(t)));

/* ---------- Çizim ---------- */
function render() {
  if (!masa) return;
  const d = durumJson();
  // Yeni tur başlayınca seçimleri sıfırla ve bildir
  if (sonTur !== null && d.tur !== undefined && d.tur !== sonTur) {
    secili = []; grupTaslak = [];
    bilgi('🔔 Tur ' + d.tur + ' başladı');
  }
  if (d.tur !== undefined) sonTur = d.tur;
  if (!benimSira() || !cekildi()) { /* grup taslağı sadece tur içinde tutulur */ }

  $('baslik').innerHTML = 'Masa #' + masaId + ' · Tur ' + (d.tur || 1);

  const puan = d.puan || {}, acik = d.acildi || {};
  $('oyuncular').innerHTML = masa.oyuncular.map((o) => {
    const sira = masa.durum === 'oynaniyor' && o.id === masa.sira_kullanici;
    return '<div class="oy' + (sira ? ' sira' : '') + '"><b>' + esc(o.nickname) + (o.id === benimUid() ? ' (sen)' : '') + '</b>' +
      '<span>' + (acik[o.id] ? '✅ açtı' : '⏳ açmadı') + ' · ' + (o.el_sayisi || 0) + ' taş · ' + (puan[o.id] || 0) + ' puan</span></div>';
  }).join('');

  $('deste').textContent = masa.deste_sayisi != null ? masa.deste_sayisi : 0;
  if (d.okey_s !== undefined && d.gosterge !== undefined) {
    $('okeyBilgi').textContent = 'Gösterge: ' + sayiOf(d.gosterge) + ' ' + SEMBOL[renkOf(d.gosterge)] +
      '  ·  Okey: ' + d.okey_s + ' ' + SEMBOL[d.okey_r];
  } else $('okeyBilgi').textContent = '';
  $('gosterge').innerHTML = d.gosterge !== undefined ? tasHtml(d.gosterge, '') : '';

  const at = d.atilan || [];
  $('atilan').innerHTML = at.length ? tasHtml(at[at.length - 1], '') : '<div class="muted">boş</div>';
  $('yigin').classList.toggle('cekilebilir', benimSira() && !cekildi());
  $('atilan').classList.toggle('cekilebilir', benimSira() && !cekildi() && at.length > 0);

  const bant = $('bant');
  if (masa.durum === 'bekliyor') {
    bant.className = 'bant';
    bant.textContent = masa.oyuncular.length < 2 ? 'Başlamak için en az 2 kişi gerekli.' : 'Oyun başlamaya hazır.';
  } else if (masa.durum === 'oynaniyor') {
    const s = masa.oyuncular.find((o) => o.id === masa.sira_kullanici);
    bant.className = 'bant' + (benimSira() ? ' sira' : '');
    bant.textContent = benimSira()
      ? (!cekildi() ? 'Sıra sende: desteden ya da atılandan taş çek' : 'Grup yap, eli aç ya da bir taş at')
      : 'Sıra: ' + (s ? s.nickname : '');
  }

  rackCiz();
  masaGruplariCiz();
  aksiyonCiz();

  const bit = $('bit');
  if (masa.durum === 'bitti') {
    const k = masa.oyuncular.find((o) => o.id === masa.kazanan);
    bit.classList.remove('gizle');
    bit.innerHTML = '🏆 Oyun bitti. Kazanan: ' + esc(k ? k.nickname : '') +
      '<div style="font-size:13px;margin-top:4px">+' + masa.odul + ' 🪙 coin</div>';
  } else bit.classList.add('gizle');
}

function rackCiz() {
  const kal = kalanTaslar();
  let h = '';
  for (let s = 0; s < 2; s++) {
    h += '<div class="raf">';
    for (let k = 0; k < 8; k++) {
      const i = s * 8 + k, t = kal[i];
      h += '<div class="slot">' +
        (t !== undefined ? '<div onclick="tasSec(' + t + ')" style="position:absolute;inset:0">' + tasHtml(t, secili.includes(t) ? 'secili' : '') + '</div>' : '') +
        '</div>';
    }
    h += '</div>';
  }
  $('rack').innerHTML = h;
  $('gruplar').innerHTML = grupTaslak.length
    ? grupTaslak.map((g, i) => '<div class="grup">' + g.map((t) => tasHtml(t, '')).join('') +
        '<button class="btn ikincil" onclick="grubuBoz(' + i + ')">Boz</button></div>').join('')
    : '<span class="muted">Henüz grup yok</span>';
  $('ipucu').textContent = benimSira() && cekildi()
    ? 'Taşları seç, en az 3 taşla grup yap. Okey taşları joker olur.'
    : '';
}

function aksiyonCiz() {
  const a = $('aksiyon');
  a.innerHTML = '';
  const ekle = (yazi, fn, ikincil, pasif) => {
    const b = document.createElement('button');
    b.className = 'btn' + (ikincil ? ' ikincil' : '');
    b.textContent = yazi;
    b.disabled = !!pasif;
    b.onclick = fn;
    a.appendChild(b);
  };
  const sahibi = masa.sahip_id === benimUid();
  if (masa.durum === 'bekliyor') {
    if (sahibi && masa.oyuncular.length >= 2) ekle('Oyunu başlat', baslat);
    ekle(sahibi ? 'Masayı kapat' : 'Masadan ayrıl', ayril, true);
    return;
  }
  if (masa.durum !== 'oynaniyor' || !benimSira() || !cekildi()) return;
  if (!acildim()) ekle('El aç (101)', elAc, false, grupTaslak.length === 0);
  else ekle('Masaya grup koy', masaGrupKoy, false, grupTaslak.length === 0);
  ekle('Grup yap', grupYap, true, secili.length < 3);
  ekle('Taşı at', at1, false, secili.length !== 1);
  ekle('Eli bitir', bitir, false, kalanTaslar().length !== 0);
  const kal = kalanTaslar();
  const ciftOlabilir = secili.length === 1 && kal.length >= 3 && kal.length % 2 === 1 &&
    cifteBul(kal.filter((x) => x !== secili[0])) !== null;
  ekle('Çiftle bitir', ciftBitir, false, !ciftOlabilir);
}

// Masadaki gruplar; açtıysan seçtiğin taşları bir gruba "＋ ekle" ile ekleyebilirsin
function masaGruplariCiz() {
  const gr = durumJson().masa_gruplar || [];
  const ekleAcik = benimSira() && cekildi() && acildim() && secili.length > 0;
  $('masaGruplar').innerHTML = gr.length
    ? gr.map((g, i) => '<div class="grup">' + g.map((t) => tasHtml(t, '')).join('') +
        (ekleAcik ? '<button class="btn" onclick="masaEkle(' + i + ')">＋ ekle</button>' : '') + '</div>').join('')
    : '<span class="muted">Henüz masaya grup konmadı</span>';
}

// İki taş çift olur mu? Aynı renk+sayı ya da biri joker
function ciftUyumlu(a, b) {
  if (okeyMu(a) || okeyMu(b)) return true;
  return renkOf(a) === renkOf(b) && sayiOf(a) === sayiOf(b);
}
// Taşları çiftlere ayırmayı dener (geri izlemeli). Bulamazsa null.
function cifteBul(ids) {
  if (ids.length % 2) return null;
  const left = ids.slice(), pairs = [];
  const rec = () => {
    if (!left.length) return true;
    const a = left.shift();
    for (let j = 0; j < left.length; j++) {
      if (ciftUyumlu(a, left[j])) {
        const b = left.splice(j, 1)[0];
        pairs.push([a, b]);
        if (rec()) return true;
        pairs.pop();
        left.splice(j, 0, b);
      }
    }
    left.unshift(a);
    return false;
  };
  return rec() ? pairs : null;
}

function masaGrupKoy() {
  if (grupTaslak.length === 0) { hata('Önce masaya koyacağın grupları yap'); return; }
  hata('');
  islem(async () => {
    const r = await rpc('okey101_masa_grup', { p_masa: masaId, p_gruplar: grupTaslak });
    grupTaslak = []; secili = [];
    if (r && r.tur) bilgi('🔔 Tur bitti, yeni tur ' + r.tur);
  });
}
function masaEkle(i) {
  if (!secili.length) { hata('Önce eklemek istediğin taşları seç'); return; }
  const taslar = secili.slice();
  hata('');
  islem(async () => {
    await rpc('okey101_masa_ekle', { p_masa: masaId, p_idx: i, p_taslar: taslar });
    secili = [];
  });
}
function ciftBitir() {
  if (secili.length !== 1) { hata('Atacağın taşı seç'); return; }
  const at = secili[0];
  const cift = cifteBul(kalanTaslar().filter((x) => x !== at));
  if (!cift) { hata('Bu taşlar çift olarak dizilemiyor'); return; }
  hata('');
  islem(async () => {
    const r = await rpc('okey101_bitir_cift', { p_masa: masaId, p_ciftler: cift, p_at: at });
    if (r && r.bitti) bilgi('🏆 Çiftli bitirme! Oyun bitti.');
    else if (r && r.tur) bilgi('🔔 Çiftli bitirme (2 katı ceza). Yeni tur ' + r.tur);
    grupTaslak = []; secili = [];
  });
}

/* ---------- Etkileşim ---------- */
function tasSec(t) {
  if (!benimSira()) { bilgi('Sıra sende değil'); return; }
  if (!cekildi()) { bilgi('Önce desteden ya da atılandan taş çek'); return; }
  secili = secili.includes(t) ? secili.filter((x) => x !== t) : secili.concat([t]);
  render();
}
function grupYap() {
  if (secili.length < 3) { hata('Grup için en az 3 taş seç'); return; }
  if (!grupOk(secili)) { hata('Bu taşlar geçerli bir grup değil (aynı sayı farklı renk ya da aynı renk ardışık)'); return; }
  grupTaslak.push(secili.slice());
  secili = [];
  hata('');
  render();
}
function grubuBoz(i) { grupTaslak.splice(i, 1); render(); }

async function islem(fn) {
  if (kilit) return;
  kilit = true;
  try { await fn(); } catch (e) { hata(e.message); }
  kilit = false;
  await yenile();
}
function cek(kaynak) {
  if (!benimSira()) { bilgi('Sıra sende değil'); return; }
  if (cekildi()) { bilgi('Bu tur zaten taş çektin'); return; }
  secili = []; grupTaslak = []; hata('');
  islem(() => rpc('okey101_cek', { p_masa: masaId, p_kaynak: kaynak }));
}
const baslat = () => islem(() => rpc('okey101_baslat', { p_masa: masaId }));
const ayril = () => islem(() => rpc('masa_ayril', { p_masa: masaId }).then(() => lobiyeDon()));

function elAc() {
  if (grupTaslak.length === 0) { hata('Önce grupları yap'); return; }
  const toplam = grupTaslak.reduce((s, g) => s + grupToplam(g), 0);
  if (toplam < 101) { hata('El açmak için en az 101 puan lazım (şu an ' + toplam + ')'); return; }
  hata('');
  islem(async () => {
    const r = await rpc('okey101_ac', { p_masa: masaId, p_gruplar: grupTaslak });
    if (r && r.bitti === false) bilgi('✅ Eli açtın (' + r.puan + ' puan)');
    grupTaslak = []; secili = [];
  });
}
function at1() {
  if (secili.length !== 1) { hata('Atmak için tek bir taş seç'); return; }
  const t = secili[0];
  hata('');
  islem(async () => {
    await rpc('okey101_at', { p_masa: masaId, p_tas: t });
    secili = []; grupTaslak = [];
  });
}
function bitir() {
  if (kalanTaslar().length) { hata('Tüm taşlar gruplarda olmalı'); return; }
  if (grupTaslak.some((g) => !grupOk(g))) { hata('Bir grup geçersiz'); return; }
  hata('');
  islem(async () => {
    const r = await rpc('okey101_bitir', { p_masa: masaId, p_gruplar: grupTaslak });
    if (r && r.bitti) bilgi('🏆 Oyun bitti!');
    else if (r && r.tur) bilgi('🔔 Tur bitti, yeni tur ' + r.tur);
    grupTaslak = []; secili = [];
  });
}

(async () => {
  hata('Bağlanıyor…');
  for (let i = 0; i < 40 && !cfgAl(); i++) await new Promise((r) => setTimeout(r, 200));
  hata('');
  lobiYukle().catch((e) => hata(e.message));
