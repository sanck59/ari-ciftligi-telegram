<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Okey101</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%;color:#fff0cf;font-family:-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden;background:#2b0f4a}
body{background:radial-gradient(circle at 50% 0,#6a2aa8 0,#3a1366 45%,#1d0838 100%) fixed}
#app{max-width:480px;margin:0 auto;padding:10px 10px 24px}
h2{margin:4px 0 10px;text-align:center;font-size:24px;font-weight:900;color:#ffd54a;text-shadow:0 2px 0 #8a5a00,0 0 14px rgba(255,200,60,.5)}
.panel{background:rgba(20,6,40,.6);border:1.5px solid #c9964a;border-radius:16px;padding:10px;margin-bottom:10px}
.btn{background:linear-gradient(#ffe27a,#f0a81c);color:#3b2406;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;margin:4px 4px 4px 0;box-shadow:0 3px 0 #9a6410}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6410}
.btn.ikincil{background:transparent;color:#fff0cf;border:1px solid #c9964a;box-shadow:none}
.btn.tehlike{background:transparent;color:#ff8a65;border:1px solid #ff8a65;box-shadow:none}
.btn:disabled{opacity:.4}
.muted{color:#cdb9e8;font-size:12px}
.satir{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.satir:last-child{border-bottom:0}.grow{flex:1}
.gizle{display:none}
.bant{padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.35);font-size:13px;text-align:center;margin-bottom:8px}
.bant.sira{background:rgba(255,213,74,.2);color:#ffd54a;font-weight:800}

.rakipler{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.rakip{flex:1;max-width:150px;background:rgba(20,6,40,.55);border:1.5px solid #6b4a9a;border-radius:14px;padding:6px 8px;display:flex;align-items:center;gap:8px;min-width:0}
.rakip.sira{border-color:#ffd54a;animation:parla .8s ease-in-out infinite alternate}
@keyframes parla{from{box-shadow:0 0 0 rgba(255,213,74,0)}to{box-shadow:0 0 14px 2px #ffd54a}}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(#8a4ad8,#5a2a9a);border:3px solid #ffd54a;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.rakip b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rakip span{font-size:11px;color:#ffe9a8}

.orta{display:flex;gap:18px;justify-content:center;align-items:flex-end;margin:6px 0 10px}
.kutu{text-align:center;font-size:11px;color:#cdb9e8}
.yigin{width:56px;height:76px;border-radius:9px;background:repeating-linear-gradient(45deg,#7a1d9c,#7a1d9c 6px,#5a1278 6px,#5a1278 12px);border:2px solid #ffd54a;display:flex;align-items:center;justify-content:center;color:#ffd54a;font-weight:900;font-size:18px;box-shadow:0 4px 10px rgba(0,0,0,.5);margin:0 auto 4px}
.atilan{width:56px;height:76px;margin:0 auto 4px;position:relative}
.atilan .bos{position:absolute;inset:0;border:2px dashed #6b4a9a;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#6b4a9a;font-size:11px}
.cekilebilir{animation:zt 1s ease-in-out infinite alternate;cursor:pointer}
@keyframes zt{from{transform:scale(1)}to{transform:scale(1.08);filter:drop-shadow(0 0 10px #ffd54a)}}

/* Istaka */
.rack{background:linear-gradient(#b07a3c,#8a5a26);border:3px solid #5f3d17;border-radius:14px;padding:8px 6px;box-shadow:inset 0 3px 10px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.5);margin-bottom:6px}
.raf{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;padding:6px 3px 8px;background:linear-gradient(#7a4f20,#9a6a30);border-radius:8px;margin:2px 0}
.slot{position:relative;aspect-ratio:3/4.3;border-radius:6px;background:rgba(0,0,0,.22);box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}
.tas{position:absolute;inset:0;border-radius:6px;background:linear-gradient(#fffdf4,#f3e8c8);border-bottom:4px solid #cdb989;box-shadow:0 3px 4px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#222;transition:transform .15s}
.tas .n{font-size:clamp(13px,4.6vw,21px);line-height:1}
.tas .d{width:34%;aspect-ratio:1;border-radius:50%;border:2px solid currentColor;margin-top:3px}
.tas.k{color:#d6322b}.tas.s{color:#d98f00}.tas.m{color:#1f6fd1}.tas.z{color:#1b1b1b}
.tas.joker{color:#2a9a54;background:linear-gradient(#f2fff4,#cdeed6)}
.tas.secili{transform:translateY(-9px);box-shadow:0 0 0 3px #ffd54a,0 8px 12px rgba(0,0,0,.5);z-index:3}
.tas.g-ok{border-bottom-color:#3fbf68;box-shadow:0 3px 4px rgba(0,0,0,.5),0 0 0 2px rgba(63,191,104,.9)}
.tas.g-hata{border-bottom-color:#e0553a;box-shadow:0 3px 4px rgba(0,0,0,.5),0 0 0 2px rgba(224,85,58,.9)}
.tas.yeni{animation:yeni 1.4s ease-out}
@keyframes yeni{0%{transform:scale(1.5);box-shadow:0 0 18px 6px #ffd54a}100%{transform:scale(1)}}
.mini{position:absolute;inset:0}
.ipucu{font-size:12px;text-align:center;color:#cdb9e8;margin-bottom:6px;min-height:16px}
.aksiyon{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
#bit{text-align:center;padding:14px;margin-bottom:10px;border-radius:16px;background:linear-gradient(#ffe27a,#f0a81c);color:#3b2406;font-weight:900;font-size:17px}
#hata{color:#ff9b7a;font-size:13px;min-height:18px;text-align:center}
#bilgi{color:#9be36b;font-size:13px;min-height:18px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <h2>🃏 Okey101</h2>
  <div id="lobi">
    <div class="panel">
      <div class="muted">Bu odadaki masalar</div>
      <div id="masalar"></div>
      <button class="btn ikincil" onclick="lobiYukle()">↻ Yenile</button>
      <div style="margin-top:8px">
        <button class="btn" onclick="masaAc(2)">2 kişilik aç</button>
        <button class="btn" onclick="masaAc(3)">3 kişilik aç</button>
        <button class="btn" onclick="masaAc(4)">4 kişilik aç</button>
      </div>
    </div>
  </div>

  <div id="masa" class="gizle">
    <div id="bit" class="gizle"></div>
    <div id="rakipler" class="rakipler"></div>
    <div class="orta">
      <div class="kutu"><div class="yigin" id="deste" onclick="cek('deste')">0</div>Deste</div>
      <div class="kutu"><div class="atilan" id="atilan" onclick="cek('atilan')"></div>Atılan</div>
    </div>
    <div id="bant" class="bant"></div>
    <div class="rack" id="rack"></div>
    <div class="ipucu" id="ipucu"></div>
    <div class="aksiyon" id="aksiyon"></div>
    <div class="panel" style="margin-top:10px">
      <button class="btn ikincil" onclick="lobiyeDon()">← Masalara dön</button>
      <button class="btn tehlike" onclick="ayrilOyun()">Oyundan ayrıl</button>
    </div>
  </div>
  <div id="bilgi"></div>
  <div id="hata"></div>
</div>

<script>
// Oturum bilgisi uygulamadan biraz geç gelebilir; her çağrıda yeniden okunur
let CFG = null;
function cfgAl() { if (!CFG) CFG = window.ARI_CIFTLIK || null; return CFG; }
const odaAl = () => window.ARI_ODA || null;

const SUTUN = 11, SATIR = 2, N = SUTUN * SATIR;
const SINIF = ['k', 's', 'm', 'z'];            // kırmızı, sarı, mavi, siyah (sunucudaki sıra)
let masaId = null, masa = null, timer = null, kilit = false;
let rack = new Array(N).fill(null), secili = -1, yeniId = null, imzaR = '', yuklu = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hata(m) { $('hata').textContent = m || ''; }
function bilgi(m) { $('bilgi').textContent = m || ''; clearTimeout(bilgi._t); bilgi._t = setTimeout(() => $('bilgi').textContent = '', 2600); }

async function rpc(ad, body) {
  if (!cfgAl()) throw new Error('Oturum yok, uygulamadan tekrar gir');
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + ad, {
    method: 'POST',
    headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Hata ' + r.status));
  return j;
}
async function tablo(yol) {
  if (!cfgAl()) return [];
  const r = await fetch(CFG.url + '/rest/v1/' + yol, { headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.token } });
  return r.json();
}

/* ---------- Taş kodlaması (sunucuyla aynı) ---------- */
// id 0..103: renk = floor(id/26), sayı = (id%26)%13+1. id 104,105: joker.
const jokerMi = (id) => id >= 104;
const renkOf = (id) => Math.floor(id / 26);
const sayiOf = (id) => (id % 26) % 13 + 1;
function tasHtml(id, ek) {
  if (jokerMi(id)) return '<div class="tas joker ' + (ek || '') + '"><div class="n">★</div><div class="d" style="border-color:transparent"></div></div>';
  return '<div class="tas ' + SINIF[renkOf(id)] + ' ' + (ek || '') + '"><div class="n">' + sayiOf(id) + '</div><div class="d"></div></div>';
}

/* ---------- Grup kontrolü (yalnızca renk ipucu; son karar sunucuda) ---------- */
function grupGecerli(ids) {
  if (ids.length < 3) return false;
  const t = ids.filter((x) => !jokerMi(x));
  if (t.length === 0) return true;
  const sayilar = t.map(sayiOf), renkler = t.map(renkOf);
  // aynı sayı, farklı renkler (3-4 taş)
  if (new Set(sayilar).size === 1 && new Set(renkler).size === renkler.length && ids.length <= 4) return true;
  // aynı renk, ardışık sayılar (joker boşluk doldurur); 12-13-1 serisine izin ver
  if (new Set(renkler).size !== 1 || new Set(sayilar).size !== sayilar.length || ids.length > 13) return false;
  const dene = (sayi, enAz, enCok) => {
    const mn = Math.min(...sayi), mx = Math.max(...sayi);
    if (mx - mn + 1 > ids.length) return false;
    for (let s = Math.max(enAz, mx - ids.length + 1); s <= mn; s++) if (s + ids.length - 1 <= enCok) return true;
    return false;
  };
  if (dene(sayilar, 1, 13)) return true;
  if (sayilar.includes(1)) return dene(sayilar.map((x) => (x === 1 ? 14 : x)), 2, 14);
  return false;
}

/* ---------- Istaka düzeni ---------- */
function diz(mod, ids) {
  const joker = ids.filter(jokerMi), t = ids.filter((x) => !jokerMi(x));
  const gruplar = [];
  if (mod === 'renk') {
    for (let c = 0; c < 4; c++) { const g = t.filter((x) => renkOf(x) === c).sort((a, b) => sayiOf(a) - sayiOf(b) || a - b); if (g.length) gruplar.push(g); }
  } else {
    for (let n = 1; n <= 13; n++) { const g = t.filter((x) => sayiOf(x) === n).sort((a, b) => renkOf(a) - renkOf(b) || a - b); if (g.length) gruplar.push(g); }
  }
  if (joker.length) gruplar.push(joker);
  const out = new Array(N).fill(null);
  let satir = 0, kol = 0;
  const yerlesmeyen = [];
  gruplar.forEach((g) => {
    let kalan = g.slice();
    while (kalan.length) {
      if (satir >= SATIR) { yerlesmeyen.push(...kalan); break; }
      if (kol > 0 && kalan.length > SUTUN - kol && kalan.length <= SUTUN) { satir++; kol = 0; continue; }
      const al = Math.min(kalan.length, SUTUN - kol);
      for (let k = 0; k < al; k++) out[satir * SUTUN + kol + k] = kalan[k];
      kalan = kalan.slice(al); kol += al;
      if (kalan.length) { satir++; kol = 0; } else { kol++; if (kol >= SUTUN) { satir++; kol = 0; } }
    }
  });
  yerlesmeyen.forEach((x) => { const i = out.indexOf(null); if (i >= 0) out[i] = x; });
  return out;
}
const rackAnahtar = () => 'okey101:' + masaId + ':' + (CFG ? CFG.uid : '');
function rackKaydet() { try { localStorage.setItem(rackAnahtar(), JSON.stringify(rack)); } catch (e) { /* yok say */ } }
function rackOku() {
  try {
    const v = JSON.parse(localStorage.getItem(rackAnahtar()) || 'null');
    if (Array.isArray(v) && v.length === N) return v;
  } catch (e) { /* yok say */ }
  return null;
}
// Sunucudaki elle ıstakayı eşitle: giden taşları kaldır, gelen taşı sona koy
function senkron(el) {
  if (!yuklu) { const k = rackOku(); rack = k || new Array(N).fill(null); yuklu = true; }
  const set = new Set(el);
  rack = rack.map((x) => (x !== null && !set.has(x) ? null : x));
  const var_ = new Set(rack.filter((x) => x !== null));
  const eksik = el.filter((x) => !var_.has(x));
  if (var_.size === 0 && eksik.length) { rack = diz('renk', eksik); rackKaydet(); return; }
  if (!eksik.length) return;
  eksik.forEach((x) => {
    let son = -1;
    rack.forEach((v, i) => { if (v !== null) son = i; });
    let hedef = -1;
    for (let i = son + 1; i < N; i++) if (rack[i] === null) { hedef = i; break; }
    if (hedef < 0) hedef = rack.indexOf(null);
    if (hedef >= 0) rack[hedef] = x;
    yeniId = x;
  });
  rackKaydet();
}
// Yan yana dizili taş blokları (satır sonunda biter, boşluk bloğu ayırır)
function bloklar() {
  const sonuc = [];
  for (let s = 0; s < SATIR; s++) {
    let cur = [];
    for (let k = 0; k <= SUTUN; k++) {
      const v = k < SUTUN ? rack[s * SUTUN + k] : null;
      if (v !== null) cur.push({ slot: s * SUTUN + k, id: v });
      else if (cur.length) { sonuc.push(cur); cur = []; }
    }
  }
  return sonuc;
}

/* ---------- Lobi ---------- */
async function lobiYukle() {
  hata('');
  const ODA = odaAl();
  if (!ODA) { $('masalar').innerHTML = '<div class="muted">Oda bilgisi alınamadı. Oyunu odadan aç.</div>'; return; }
  const liste = await tablo('oyun_masalari?oda_id=eq.' + ODA + '&oyun=eq.okey101&durum=neq.bitti&select=id,durum,max_oyuncu,sahip_id&order=olusturma.desc');
  if (!Array.isArray(liste) || liste.length === 0) {
    $('masalar').innerHTML = '<div class="muted" style="padding:8px 0">Açık masa yok. Aşağıdan bir masa aç.</div>';
    return;
  }
  const oyuncular = await Promise.all(liste.map((m) => tablo('oyun_masa_oyuncular?masa_id=eq.' + m.id + '&select=kullanici_id')));
  $('masalar').innerHTML = liste.map((m, i) => {
    const n = oyuncular[i].length;
    const icinde = oyuncular[i].some((x) => x.kullanici_id === CFG.uid);
    const etiket = m.durum === 'bekliyor' ? (n + '/' + m.max_oyuncu + ' bekliyor') : 'Oynanıyor';
    const bosYok = !icinde && (m.durum === 'oynaniyor' || n >= m.max_oyuncu);
    const buton = bosYok ? '' : '<button class="btn" onclick="girMasa(' + m.id + ')">' + (icinde ? 'Aç' : 'Katıl') + '</button>';
    return '<div class="satir"><div class="grow">🃏 Masa #' + m.id + '<div class="muted">' + etiket + '</div></div>' + buton + '</div>';
  }).join('');
}
async function masaAc(n) {
  hata('');
  try { const id = await rpc('masa_ac', { p_oda: odaAl(), p_oyun: 'okey101', p_max: n, p_mod: 'klasik' }); await girMasa(id); }
  catch (e) { hata(e.message); }
}
async function girMasa(id) {
  hata('');
  try {
    const d = await rpc('masa_durumu', { p_masa: id });
    const icinde = d.oyuncular.some((o) => o.id === CFG.uid);
    if (!icinde) {
      if (d.durum !== 'bekliyor') throw new Error('Bu masa oynanıyor');
      await rpc('masa_katil', { p_masa: id });
    }
    masaId = id; yuklu = false; secili = -1; imzaR = ''; yeniId = null;
    $('lobi').classList.add('gizle');
    $('masa').classList.remove('gizle');
    await yenile();
    clearInterval(timer);
    timer = setInterval(yenile, 1500);
  } catch (e) { hata(e.message); }
}
function lobiyeDon() {
  clearInterval(timer); timer = null;
  masaId = null; masa = null; secili = -1; imzaR = ''; yuklu = false;
  $('masa').classList.add('gizle');
  $('lobi').classList.remove('gizle');
  lobiYukle();
}
async function ayrilOyun() {
  if (!masaId) return;
  const simdi = Date.now();
  if (!ayrilOyun._t || simdi - ayrilOyun._t > 4000) { ayrilOyun._t = simdi; bilgi('Ayrılmak için bir kez daha dokun'); return; }
  ayrilOyun._t = 0;
  try {
    const s = await rpc('masa_oyun_ortasi_ayril', { p_masa: masaId });
    if (s && s.bitti) bilgi(s.kazanan ? 'Masa bitti, rakip ayrıldı.' : 'Masa kapandı.'); else bilgi('Masadan ayrıldın');
    lobiyeDon();
  } catch (e) { hata(e.message); }
}
async function yenile() {
  if (!masaId) return;
  try { masa = await rpc('masa_durumu', { p_masa: masaId }); render(); }
  catch (e) { hata(e.message); }
}

/* ---------- Durum ---------- */
const benimSira = () => !!masa && masa.durum === 'oynaniyor' && masa.sira_kullanici === cfgAl().uid;
const atilanListe = () => ((masa && masa.durum_json && masa.durum_json.atilan) || []);
const elSayisi = () => (masa && masa.el ? masa.el.length : 0);
const cekmeZamani = () => benimSira() && !masa.tur_hareket && elSayisi() === 14;
const atmaZamani = () => benimSira() && masa.tur_hareket && elSayisi() === 15;

/* ---------- Çizim ---------- */
function render() {
  if (!masa) return;
  senkron(masa.el || []);
  // rakipler
  const ben = cfgAl().uid;
  $('rakipler').innerHTML = masa.oyuncular.filter((o) => o.id !== ben).map((o) => {
    const sira = masa.durum === 'oynaniyor' && o.id === masa.sira_kullanici;
    return '<div class="rakip' + (sira ? ' sira' : '') + '"><div class="av">' + esc(String(o.nickname || 'A').charAt(0).toUpperCase()) +
      '</div><div style="min-width:0"><b>' + esc(o.nickname) + '</b><span>' + (sira ? '🃏 Sırada' : '🀄 ' + (o.el_sayisi || 0) + ' taş') + '</span></div></div>';
  }).join('');
  // orta
  $('deste').textContent = masa.deste_sayisi;
  $('deste').classList.toggle('cekilebilir', cekmeZamani());
  const at = atilanListe();
  const ustTas = at.length ? at[at.length - 1] : null;
  $('atilan').innerHTML = ustTas !== null ? '<div class="mini">' + tasHtml(ustTas, '') + '</div>' : '<div class="bos">boş</div>';
  $('atilan').classList.toggle('cekilebilir', cekmeZamani() && ustTas !== null);
  // bant
  const bant = $('bant');
  if (masa.durum === 'bekliyor') {
    bant.className = 'bant'; bant.textContent = masa.oyuncular.length < 2 ? 'Başlamak için en az 2 kişi gerekli.' : 'Oyun başlamaya hazır.';
  } else if (masa.durum === 'oynaniyor') {
    const s = masa.oyuncular.find((o) => o.id === masa.sira_kullanici);
    bant.className = 'bant' + (benimSira() ? ' sira' : '');
    bant.textContent = cekmeZamani() ? 'Sıra sende: desteden ya da atılandan taş çek'
      : atmaZamani() ? 'Bir taş seçip at, ya da hepsi gruplandıysa eli bitir'
      : benimSira() ? 'Sıra sende' : 'Sıra: ' + (s ? s.nickname : '');
  } else {
    const k = masa.oyuncular.find((o) => o.id === masa.kazanan);
    bant.className = 'bant sira'; bant.textContent = '🏆 Kazanan: ' + (k ? k.nickname : '') + ' · +' + masa.odul + ' 🪙';
  }
  rackCiz();
  aksiyonCiz();
  const bit = $('bit');
  if (masa.durum === 'bitti') {
    const k = masa.oyuncular.find((o) => o.id === masa.kazanan);
    bit.classList.remove('gizle');
    bit.innerHTML = '🏆 Kazanan: ' + esc(k ? k.nickname : '') + '<div style="font-size:14px;margin-top:4px">+' + masa.odul + ' 🪙 coin</div>';
  } else bit.classList.add('gizle');
}
function rackCiz() {
  const bl = bloklar();
  const durumBlok = new Array(N).fill('');
  let gruplanan = 0, gecerli = 0;
  bl.forEach((b) => {
    if (b.length < 3) return;
    const ok = grupGecerli(b.map((x) => x.id));
    b.forEach((x) => { durumBlok[x.slot] = ok ? 'g-ok' : 'g-hata'; });
    if (ok) { gruplanan += b.length; gecerli++; }
  });
  const imza = JSON.stringify([rack, secili, yeniId, durumBlok.join(','), atmaZamani(), cekmeZamani()]);
  if (imza !== imzaR) {
    imzaR = imza;
    let h = '';
    for (let s = 0; s < SATIR; s++) {
      h += '<div class="raf">';
      for (let k = 0; k < SUTUN; k++) {
        const i = s * SUTUN + k, v = rack[i];
        h += '<div class="slot" data-i="' + i + '" onclick="slotTikla(' + i + ')">' +
          (v !== null ? tasHtml(v, (secili === i ? 'secili ' : '') + (v === yeniId ? 'yeni ' : '') + durumBlok[i]) : '') + '</div>';
      }
      h += '</div>';
    }
    $('rack').innerHTML = h;
  }
  const el = elSayisi();
  $('ipucu').textContent = el ? 'Gruplanan taş: ' + gruplanan + '/' + el + ' · Geçerli grup: ' + gecerli + ' · Gruplar arasında boş yuva bırak' : '';
}
function aksiyonCiz() {
  const a = $('aksiyon');
  a.innerHTML = '';
  const ekle = (yazi, fn, ikincil, pasif) => { const b = document.createElement('button'); b.className = 'btn' + (ikincil ? ' ikincil' : ''); b.textContent = yazi; b.disabled = !!pasif; b.onclick = fn; a.appendChild(b); };
  const sahibi = masa.sahip_id === cfgAl().uid;
  if (masa.durum === 'bekliyor') {
    if (sahibi && masa.oyuncular.length >= 2) ekle('Oyunu başlat', baslat);
    ekle(sahibi ? 'Masayı kapat' : 'Masadan ayrıl', ayril, true);
    return;
  }
  if (masa.durum !== 'oynaniyor') return;
  ekle('Renge göre diz', () => sirala('renk'), true);
  ekle('Sayıya göre diz', () => sirala('sayi'), true);
  if (atmaZamani()) {
    ekle('Taşı at', at1, false, secili < 0);
    ekle('Eli bitir', bitir, false);
  }
}

/* ---------- Etkileşim ---------- */
function slotTikla(i) {
  if (!masa) return;
  if (secili === -1) { if (rack[i] !== null) { secili = i; yeniId = null; } }
  else if (secili === i) secili = -1;
  else { const a = rack[secili]; rack[secili] = rack[i]; rack[i] = a; secili = -1; rackKaydet(); }
  render();
}
function sirala(mod) {
  rack = diz(mod, rack.filter((x) => x !== null));
  secili = -1; rackKaydet(); render();
}
async function islem(fn) {
  if (kilit) return;
  kilit = true;
  try { await fn(); } catch (e) { hata(e.message); }
  kilit = false;
  await yenile();
}
const cek = (kaynak) => { if (!cekmeZamani()) { bilgi(benimSira() ? 'Bu tur zaten taş çektin' : 'Sıra sende değil'); return; } islem(() => rpc('okey101_cek', { p_masa: masaId, p_kaynak: kaynak })); };
const baslat = () => islem(() => rpc('okey101_baslat', { p_masa: masaId }));
const ayril = () => islem(() => rpc('masa_ayril', { p_masa: masaId }).then(() => lobiyeDon()));
function at1() {
  if (secili < 0 || rack[secili] === null) { hata('Atmak için önce bir taş seç'); return; }
  const tas = rack[secili];
  hata('');
  islem(async () => { await rpc('okey101_at', { p_masa: masaId, p_tas: tas }); secili = -1; });
}
function bitir() {
  const bl = bloklar();
  if (bl.some((b) => b.length < 3)) { hata('Tüm taşlar en az 3\'lük gruplarda olmalı (tek kalan taş var)'); return; }
  hata('');
  const gruplar = bl.map((b) => b.map((x) => x.id));
  islem(async () => { await rpc('okey101_bitir', { p_masa: masaId, p_gruplar: gruplar }); bilgi('🏆 Elini bitirdin!'); });
}

(async () => {
  hata('Bağlanıyor…');
  for (let i = 0; i < 40 && !cfgAl(); i++) await new Promise((r) => setTimeout(r, 200));
  hata('');
  lobiYukle().catch((e) => hata(e.message));
})();
</script>
