<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bal Çiftliği</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd14a;color:#4a2f10;font-family:-apple-system,Roboto,Arial,sans-serif}
#m{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.pil{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,248,228,.95);border-radius:18px;padding:7px 10px;box-shadow:0 3px 0 rgba(120,80,20,.35);min-width:0}
.pil .ik{font-size:22px}.pil>div:nth-child(2){flex:1;min-width:0;line-height:1.15}
.pil b{display:block;font-size:14px;font-weight:900;white-space:nowrap}.pil i{font-style:normal;font-size:10px;color:#9a7440}
.bar{height:6px;width:100%;background:#ecd9a8;border-radius:4px;overflow:hidden;margin-top:3px}.bar u{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc94a,#f09a14);text-decoration:none}
#bst{position:absolute;left:8px;top:62px;background:#ffdd55;border-radius:14px;padding:4px 10px;font-size:12px;font-weight:900;box-shadow:0 2px 0 #9a6410}
#nav{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:flex-end;background:#fff4d6;border-radius:24px;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0));box-shadow:0 4px 0 rgba(120,80,20,.4)}
.nv{flex:1;border:0;background:transparent;color:#7a5628;font-size:10.5px;font-weight:800;padding:4px 0;position:relative}
.nv i{display:block;font-style:normal;font-size:22px;line-height:1.2}.nv.on{color:#c46f00}.nv.on i{transform:translateY(-2px)}
.nv.ort{flex:0 0 74px}
.nv.ort i{width:62px;height:62px;margin:-30px auto 2px;border-radius:50%;background:linear-gradient(#ffd85a,#f0a81c);border:3px solid #fff4d6;box-shadow:0 3px 0 #9a6410;font-size:30px;line-height:56px}
.rz{position:absolute;top:0;right:18%;min-width:16px;height:16px;border-radius:8px;background:#ff5a3c;color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:900}
#sheet{display:none;position:absolute;left:0;right:0;bottom:86px;max-height:62%;overflow-y:auto;background:#fff4d6;border-radius:22px 22px 0 0;padding:12px 14px 16px;box-shadow:0 -6px 22px rgba(60,35,0,.4);border-top:3px solid #e0b45a}
#sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#st{font-size:20px;font-weight:900}
#kapat{border:0;background:rgba(120,80,20,.15);width:32px;height:32px;border-radius:50%;font-size:16px;color:#4a2f10}
.kt{background:#fffaf0;border:1.5px solid #ecd49a;border-radius:14px;padding:10px;margin-bottom:8px}
.alt{font-size:12.5px;color:#8a6a38;margin:0 0 8px;line-height:1.4}
.bas{font-size:13px;font-weight:900;color:#c46f00;margin:10px 0 6px}
.satir{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0dfb4;font-size:13px}.satir:last-child{border-bottom:0}
.satir .e{font-size:26px}.satir .g{flex:1;min-width:0;line-height:1.25}.satir small{display:block;color:#9a7440;font-size:11px}
.btn{background:linear-gradient(#ffd85a,#f0a81c);color:#3b2406;border:0;border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;margin:3px 4px 3px 0;box-shadow:0 3px 0 #9a6410}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6410}.btn:disabled{opacity:.4}
.btn.k{background:#ecd9a8;box-shadow:0 3px 0 #bfa563;color:#5a3d12}
.say{font-size:14px;margin:4px 0}.say b{font-size:20px;color:#c46f00}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;border:1.5px solid #e0b45a;background:transparent;border-radius:12px;padding:8px;font-weight:800;color:#7a5628}.seg button.on{background:#ffd85a;color:#3b2406}
.rozet{font-size:10.5px;font-weight:800;border-radius:9px;padding:2px 8px;background:#ecd9a8;color:#7a5628}.rozet.a{background:#b8e8a0;color:#2a5a14}
#hata{position:absolute;left:8px;right:8px;top:92px;text-align:center;color:#c0391b;font-size:12px;font-weight:700;text-shadow:0 1px 0 #fff;pointer-events:none}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:rgba(60,35,0,.85);border:2px solid #ffd54a;color:#ffd54a;font-weight:900;font-size:15px;padding:9px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
#toast.go{opacity:1}#toast.bk{font-size:22px;padding:11px 24px}
@keyframes orb{to{transform:rotate(360deg)}}.orb{animation:orb 10s linear infinite}
@keyframes bob{from{transform:translateY(-2px)}to{transform:translateY(2px)}}.bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes yz{from{transform:translateY(0)}to{transform:translateY(-4px)}}.yz{animation:yz .8s ease-in-out infinite alternate}
.gizle{display:none}
</style>
</head>
<body>
<svg id="m" viewBox="0 0 380 600" preserveAspectRatio="xMidYMid slice"></svg>
<div id="hud">
  <div class="pil"><span class="ik">🍯</span><div><b id="hD">0 kg</b><i id="hK">depo</i><div class="bar"><u id="hB"></u></div></div></div>
  <div class="pil"><span class="ik" id="sI">🌸</span><div><b id="sA">İlkbahar</b><i id="sT"></i><div class="bar"><u id="sB"></u></div></div></div>
</div>
<div id="bst" class="gizle">⚡ x2 <span id="bsT"></span></div>
<div id="hata"></div>
<div id="sheet"><div id="sh"><span id="st"></span><button id="kapat">✕</button></div><div id="sc"></div></div>
<div id="nav">
  <button class="nv" data-s="magaza"><i>🛒</i>Mağaza</button>
  <button class="nv" data-s="pazar"><i>🏪</i>Pazar</button>
  <button class="nv ort" data-s="hasat"><i>🧺</i>Hasat</button>
  <button class="nv" data-s="siparis"><i>📜</i>Siparişler<span class="rz gizle" id="rz"></span></button>
  <button class="nv" data-s="vadi"><i>⛰️</i>Vadi</button>
</div>
<div id="toast"></div>

<script>
const CFG=window.ARI_CIFTLIK||null;
const SEZ=[['İlkbahar','🌸'],['Yaz','☀️'],['Sonbahar','🍂'],['Kış','❄️']];
const PAL=[['#9be36b','#8fd95f','#a9ea78'],['#7fd14a','#74c941','#8bd856'],['#dfae52','#d3a147','#e8bc63'],['#e6eef2','#dce7ed','#f1f6f8']];
const BAS={magaza:'🛒 Mağaza',kovan:'🐝 Kovan',pazar:'🏪 Pazar',hasat:'🧺 Hasat',siparis:'📜 Siparişler',vadi:'⛰️ Vadi'};
const S=24,DX=Math.sqrt(3)*S,DY=1.5*S,CX=190,CY=285;
let d=null,alindi=0,kilit=false,sekme='',vadiSek='hedef',imzaM='',imzaP='',sonYukle=0;
const $=id=>document.getElementById(id);
const num=v=>Number(v||0).toLocaleString('tr-TR',{maximumFractionDigits:1});
function hata(m){$('hata').textContent=m||''}
function toast(m,b){const e=$('toast');e.textContent=m;e.className=(b?'bk ':'')+'go';clearTimeout(toast._t);toast._t=setTimeout(()=>{e.className=b?'bk':''},2300)}
function titre(){if(navigator.vibrate)navigator.vibrate(15)}
function sure(s){s=Math.max(0,Math.round(s));const sa=Math.floor(s/3600),m=Math.floor(s%3600/60),k=s%60;return sa?sa+'sa '+m+'dk':m+':'+(k<10?'0':'')+k}

async function rpc(ad,body){
  if(!CFG)throw new Error('Oturum yok. Oyunu uygulamadan aç.');
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+ad,{method:'POST',headers:{apikey:CFG.anon,Authorization:'Bearer '+CFG.token,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||('Hata '+r.status));
  return j;
}
async function yukle(){
  sonYukle=Date.now();
  try{d=await rpc('bal_durum');alindi=Date.now();hata('');ciz()}catch(e){hata(e.message)}
}
async function eylem(ad,body,mesaj,buyuk){
  if(kilit)return;kilit=true;
  try{const r=await rpc(ad,body);titre();if(mesaj)toast(mesaj(r),buyuk)}catch(e){hata(e.message)}
  kilit=false;await yukle();
}

/* ---------- Harita ---------- */
const px=(q,r)=>[CX+DX*(q+r/2),CY+DY*r];
function hexPts(x,y,rad){let p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);p.push((x+rad*Math.cos(a)).toFixed(1)+','+(y+rad*Math.sin(a)).toFixed(1))}return p.join(' ')}
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function spiral(n){const o=[];let k=1;while(o.length<n){let q=-k,r=k;for(let i=0;i<6;i++){for(let j=0;j<k;j++){o.push([q,r]);q+=DIRS[i][0];r+=DIRS[i][1]}}k++}return o.slice(0,n)}
const mes=(q,r)=>(Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2;
function zemin(sz){
  let s='<rect width="380" height="600" fill="'+PAL[sz][0]+'"/>';
  for(let r=-10;r<=10;r++)for(let q=-10;q<=10;q++){
    const [x,y]=px(q,r);if(x<-30||x>410||y<-30||y>630)continue;
    const h=(((q*73856093)^(r*19349663))>>>0),dist=mes(q,r);
    let f=PAL[sz][h%3];
    const su=dist>3&&h%17===0;
    if(su)f='#6fc1e8';
    s+='<polygon points="'+hexPts(x,y,S-.6)+'" fill="'+f+'" stroke="rgba(0,0,0,.07)" stroke-width="1"/>';
    if(!su&&dist>3&&h%7===0)s+='<text x="'+x.toFixed(1)+'" y="'+(y+6).toFixed(1)+'" text-anchor="middle" font-size="19">'+(h%2?'🌳':'🌲')+'</text>';
    else if(!su&&dist>3&&h%11===0)s+='<text x="'+x.toFixed(1)+'" y="'+(y+5).toFixed(1)+'" text-anchor="middle" font-size="12">'+(sz===3?'🪨':'🌿')+'</text>';
  }
  return s;
}
function kovanCiz(lv){
  return '<g data-k="kovan" transform="translate('+CX+' '+CY+')"><ellipse cy="18" rx="26" ry="8" fill="#000" opacity=".22"/>'+
    '<rect x="-19" y="2" width="38" height="15" rx="6" fill="#f2b632" stroke="#9a6410" stroke-width="1.3"/><rect x="-16" y="-10" width="32" height="14" rx="6" fill="#ffc94a" stroke="#9a6410" stroke-width="1.3"/><rect x="-13" y="-21" width="26" height="13" rx="6" fill="#f2b632" stroke="#9a6410" stroke-width="1.3"/>'+
    '<path d="M-15 -21 Q0 -36 15 -21Z" fill="#c9792a" stroke="#8a4a14" stroke-width="1.2"/><ellipse cy="9" rx="4.5" ry="3.2" fill="#4a2a0a"/>'+
    '<circle cx="19" cy="-24" r="8" fill="#fff4d6" stroke="#c46f00" stroke-width="1.4"/><text x="19" y="-20.5" text-anchor="middle" font-size="10" font-weight="900" fill="#c46f00">'+lv+'</text></g>';
}
function arilar(n){
  let s='';
  for(let i=0;i<n;i++){
    const rad=34+(i*13)%52,sn=7+(i*5)%9,gec=-(i*1.3).toFixed(1),yon=i%2?'reverse':'normal';
    s+='<g class="orb" style="transform-origin:'+CX+'px '+CY+'px;animation-duration:'+sn+'s;animation-delay:'+gec+'s;animation-direction:'+yon+'"><g transform="translate('+(CX+rad)+' '+(CY-(i*9)%30+8)+')"><g class="bob"><ellipse cx="-2" cy="-3" rx="3" ry="1.8" fill="#fff" opacity=".8"/><ellipse rx="3.6" ry="2.6" fill="#ffcc22" stroke="#3a2200" stroke-width=".8"/><line x1="-1" y1="-2.4" x2="-1" y2="2.4" stroke="#3a2200" stroke-width=".9"/></g></g></g>';
  }
  return s;
}
function harita(){
  const al=d.alanlar||[],sp=spiral(Math.min(20,al.length+1));
  let s=zemin(d.sezon);
  s+='<polygon points="'+hexPts(CX,CY,S-1)+'" fill="#ffe28a" stroke="#d9a030" stroke-width="2"/>';
  const lst=sp.map((p,i)=>({p,i})).sort((a,b)=>px(a.p[0],a.p[1])[1]-px(b.p[0],b.p[1])[1]);
  lst.forEach(({p,i})=>{
    const [x,y]=px(p[0],p[1]),a=al[i];
    if(!a){
      if(al.length>=20)return;
      s+='<g data-k="bos"><polygon points="'+hexPts(x,y,S-2)+'" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="2" stroke-dasharray="4 3"/><text class="yz" x="'+x.toFixed(1)+'" y="'+(y+7).toFixed(1)+'" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#0004" stroke-width=".6">＋</text></g>';
      return;
    }
    const op=a.aktif?1:.4,e=a.emoji||'🌼';
    s+='<g data-k="cicek" data-i="'+i+'"><polygon points="'+hexPts(x,y,S-2)+'" fill="#7a5230" stroke="#e8b84a" stroke-width="2.2"/><g opacity="'+op+'">'+
      '<text x="'+x.toFixed(1)+'" y="'+(y+6).toFixed(1)+'" text-anchor="middle" font-size="17">'+e+'</text>'+
      '<text x="'+(x-9).toFixed(1)+'" y="'+(y+14).toFixed(1)+'" text-anchor="middle" font-size="9">'+e+'</text><text x="'+(x+9).toFixed(1)+'" y="'+(y-7).toFixed(1)+'" text-anchor="middle" font-size="9">'+e+'</text></g>'+
      (a.aktif?'':'<text x="'+x.toFixed(1)+'" y="'+(y-10).toFixed(1)+'" text-anchor="middle" font-size="9">💤</text>')+'</g>';
  });
  s+=kovanCiz(d.kovan);
  if(al.some(a=>a.aktif))s+=arilar(Math.min(12,3+d.kovan*2));
  $('m').innerHTML=s;
}

/* ---------- Paneller ---------- */
function btn(yazi,a,k,ek){return '<button class="btn'+(k?' k':'')+'" data-a="'+a+'" '+(ek||'')+'>'+yazi+'</button>'}
function panel(){
  const sh=$('sheet');
  if(!sekme){sh.style.display='none';return}
  sh.style.display='block';$('st').textContent=BAS[sekme];
  const st=sh.scrollTop,sc=$('sc'),dp=Math.floor(d.depo*10)/10,kal=Math.max(0,d.gunluk_limit-d.gunluk_coin),dolu=d.alanlar.length;
  let h='';
  if(sekme==='magaza'){
    h='<div class="alt">Çiçek alanı: <b>'+dolu+'/20</b> · Şimdi: '+SEZ[d.sezon][1]+' '+SEZ[d.sezon][0]+'. Her çiçek yalnızca kendi mevsiminde bal üretir.</div>';
    [0,1,2,3].forEach(sz=>{
      const l=d.turler.filter(t=>t.sezon===sz);if(!l.length)return;
      h+='<div class="bas">'+SEZ[sz][1]+' '+SEZ[sz][0]+(sz===d.sezon?' · şimdi':'')+'</div><div class="kt">'+l.map(t=>'<div class="satir"><span class="e">'+(t.emoji||'🌼')+'</span><div class="g"><b>'+t.ad+'</b><small>+'+num(t.hiz*d.kovan)+' kg/dk (kovan Sv '+d.kovan+')</small></div>'+btn(num(t.fiyat)+' 🪙','dik',0,'data-t="'+t.tur+'"'+(dolu>=20?' disabled':''))+'</div>').join('')+'</div>';
    });
  }else if(sekme==='kovan'){
    h='<div class="kt"><div class="say">Seviye <b>'+d.kovan+'/10</b></div><div class="alt">Depo kapasitesi: '+num(d.kapasite)+' kg · Üretim: '+num(d.dk_uretim)+' kg/dk</div>'+
      (d.kovan>=10?'<div class="alt">🏆 Kovan en yüksek seviyede.</div>':btn('Yükselt · '+num(d.kovan_maliyet)+' 🪙','kovan'))+'</div>';
  }else if(sekme==='pazar'){
    h='<div class="kt"><div class="say"><b>'+num(dp)+'</b> / '+num(d.kapasite)+' kg · fiyat '+d.fiyat+' 🪙/kg</div><div class="bar"><u style="width:'+Math.min(100,d.gunluk_coin/d.gunluk_limit*100)+'%"></u></div><div class="alt" style="margin:4px 0 8px">Bugünkü satış: '+num(d.gunluk_coin)+' / '+num(d.gunluk_limit)+' 🪙</div>'+
      [[.25,'%25'],[.5,'%50'],[1,'Hepsi']].map(x=>{const kg=Math.floor(dp*x[0]*10)/10;const c=Math.min(Math.floor(kg*d.fiyat),kal);return btn(x[1]+' · +'+num(c)+' 🪙','sat',0,'data-kg="'+kg+'"'+(kg<=0||kal<=0?' disabled':''))}).join('')+'</div>';
    const u=d.urunler.filter(x=>x.adet>0);
    h+='<div class="bas">🏭 Atölye ürünlerim</div><div class="kt">'+(u.length?u.map(x=>'<div class="satir"><div class="g"><b>'+x.ad+' ×'+x.adet+'</b><small>'+num(x.fiyat)+' 🪙 / adet</small></div>'+btn('1 sat','usat',1,'data-u="'+x.urun+'" data-n="1"')+btn('Hepsi','usat',0,'data-u="'+x.urun+'" data-n="'+x.adet+'"')+'</div>').join(''):'<div class="alt" style="margin:0">Ürün yok. Vadi → Atölye bölümünden üretebilirsin.</div>')+'</div>';
  }else if(sekme==='hasat'){
    const dolum=dp>=d.kapasite-0.5;
    h='<div class="kt" style="text-align:center"><div style="font-size:46px">🧺</div><div class="say"><b>'+num(dp)+'</b> / '+num(d.kapasite)+' kg</div><div class="bar"><u style="width:'+Math.min(100,dp/d.kapasite*100)+'%"></u></div>'+
      '<div class="alt" style="margin:6px 0">'+(dolum?'⚠️ Depo dolu, üretim durdu. Hemen sat!':'Arılar çalışıyor: +'+num(d.dk_uretim)+' kg/dk')+'</div>'+
      btn('🍯 Hasat et ve sat','sat',0,'data-kg="'+dp+'"'+(dp<=0||kal<=0?' disabled':''))+'<div class="alt" style="margin:0">Bugün kalan satış hakkı: '+num(kal)+' 🪙</div></div>';
  }else if(sekme==='siparis'){
    h='<div class="alt">Köylülerin özel siparişleri piyasadan çok daha iyi öder. Depoda yeterli bal olmalı.</div>'+(d.siparisler.length?d.siparisler.map(o=>'<div class="kt"><div class="satir" style="border:0;padding:0"><span class="e">'+(o.emoji||'🍯')+'</span><div class="g"><b>'+o.musteri+'</b><small>'+num(o.kg)+' kg '+o.ad+' balı istiyor</small><small>Depoda '+num(dp)+' kg · ⏳ <span class="ka" data-k="'+o.kalan+'"></span></small></div><div style="text-align:right"><b style="color:#c46f00">+'+num(o.odul_coin)+' 🪙</b>'+(o.odul_elmas>0?'<br><b style="color:#2a7ab5">+'+o.odul_elmas+' 💎</b>':'')+'</div></div>'+btn('Teslim et','teslim',0,'data-id="'+o.id+'"'+(dp<o.kg?' disabled':''))+'</div>').join(''):'<div class="kt"><div class="alt" style="margin:0">Şu an sipariş yok, birazdan yenileri gelir.</div></div>');
  }else{
    h='<div class="seg"><button data-a="vs" data-v="hedef" class="'+(vadiSek==='hedef'?'on':'')+'">🎯 Hedefler</button><button data-a="vs" data-v="atolye" class="'+(vadiSek==='atolye'?'on':'')+'">🏭 Atölye</button></div>';
    if(vadiSek==='hedef'){
      const al=d.hedefler.filter(x=>x.alindi).length;
      h+='<div class="alt">Toplam satılan bal: <b>'+num(d.satilan)+' kg</b> · Çiçek alanı '+d.alanlar.length+'/20 · Kovan Sv '+d.kovan+'</div>'+d.hedefler.map((x,i)=>{
        const hazir=!x.alindi&&i===al&&d.satilan>=x.esik;
        return '<div class="kt"><div class="satir" style="border:0;padding:0"><div class="g"><b>'+(x.alindi?'✅ ':'')+num(x.esik)+' kg bal sat</b><small>'+num(Math.min(d.satilan,x.esik))+' / '+num(x.esik)+' kg</small></div>'+(x.alindi?'<span class="rozet a">Alındı</span>':btn('+'+x.odul+' 💎','hedef',0,hazir?'':'disabled'))+'</div><div class="bar"><u style="width:'+Math.min(100,d.satilan/x.esik*100)+'%"></u></div></div>';
      }).join('');
    }else{
      h+='<div class="alt">Depodaki balı daha değerli ürünlere çevir; ürünleri Pazar sekmesinde satarsın.</div><div class="kt">'+d.urunler.map(x=>'<div class="satir"><div class="g"><b>'+x.ad+'</b><small>1 adet = '+num(x.kg_basi)+' kg bal · değeri '+num(x.fiyat)+' 🪙 · stokta '+x.adet+'</small></div>'+btn('×1','uret',0,'data-u="'+x.urun+'" data-n="1"'+(dp<x.kg_basi?' disabled':''))+btn('×5','uret',1,'data-u="'+x.urun+'" data-n="5"'+(dp<x.kg_basi*5?' disabled':''))+'</div>').join('')+'</div>';
    }
  }
  sc.innerHTML=h;sh.scrollTop=st;tick();
}

function ciz(){
  if(!d)return;
  document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.s===sekme));
  const rz=$('rz');rz.textContent=d.siparisler.length;rz.classList.toggle('gizle',!d.siparisler.length);
  const im=JSON.stringify([d.sezon,d.kovan,d.alanlar.map(a=>a.tur+(a.aktif?1:0))]);
  if(im!==imzaM){imzaM=im;harita()}
  imzaP='';panel();tick();
}
function tick(){
  if(!d)return;
  const gec=(Date.now()-alindi)/60000,dep=Math.min(d.kapasite,d.depo+d.dk_uretim*gec);
  $('hD').textContent=num(dep)+' kg';$('hK').textContent='kapasite '+num(d.kapasite)+' kg · +'+num(d.dk_uretim)+'/dk';$('hB').style.width=Math.min(100,dep/d.kapasite*100)+'%';
  const kalan=21600-((Date.now()/1000)%21600),sz=d.sezon;
  $('sI').textContent=SEZ[sz][1];$('sA').textContent=SEZ[sz][0];$('sT').textContent='sonraki mevsime '+sure(kalan);$('sB').style.width=(100-kalan/21600*100)+'%';
  const bk=d.boost_kalan-(Date.now()-alindi)/1000;
  $('bst').classList.toggle('gizle',!(bk>0));if(bk>0)$('bsT').textContent=sure(bk);
  document.querySelectorAll('.ka').forEach(e=>{e.textContent=sure(Number(e.dataset.k)-(Date.now()-alindi)/1000)});
  if(bk<=0&&d.boost_kalan>0&&Date.now()-sonYukle>1500)yukle();
}

/* ---------- Olaylar ---------- */
$('m').addEventListener('click',e=>{
  const g=e.target.closest('[data-k]');if(!g||!d)return;
  const k=g.dataset.k;
  if(k==='bos'){sekme='magaza';ciz()}
  else if(k==='kovan'){sekme='kovan';ciz()}
  else if(k==='cicek'){const a=d.alanlar[+g.dataset.i];toast(a.ad+' · '+(a.aktif?'+'+num(a.hiz)+' kg/dk':'şu an mevsim dışı, uyuyor 💤'))}
});
$('sc').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a==='dik')eylem('bal_cicek_dik',{p_tur:b.dataset.t},()=>'Çiçek dikildi 🌼');
  else if(a==='kovan')eylem('bal_kovan_yukselt',{},()=>'Kovan yükseltildi 🐝',true);
  else if(a==='sat')eylem('bal_sat',{p_kg:Number(b.dataset.kg)},r=>'+'+num(r.coin)+' 🪙'+(r.elmas>0?' · +'+r.elmas+' 💎':''),true);
  else if(a==='usat')eylem('bal_urun_sat',{p_urun:b.dataset.u,p_adet:Number(b.dataset.n)},r=>'+'+num(r.coin)+' 🪙',true);
  else if(a==='uret')eylem('bal_atolye_uret',{p_urun:b.dataset.u,p_adet:Number(b.dataset.n)},()=>'Üretildi 🏭');
  else if(a==='teslim')eylem('bal_siparis_teslim',{p_id:Number(b.dataset.id)},r=>'+'+num(r.coin)+' 🪙'+(r.elmas>0?' · +'+r.elmas+' 💎':''),true);
  else if(a==='hedef')eylem('bal_hedef_al',{},r=>'+'+r.elmas+' 💎',true);
  else if(a==='vs'){vadiSek=b.dataset.v;if(d)panel()}
});
document.querySelectorAll('.nv').forEach(b=>{b.onclick=()=>{sekme=(b.dataset.s===sekme)?'':b.dataset.s;if(d)ciz()}});
$('kapat').onclick=()=>{sekme='';if(d)ciz()};

yukle();
setInterval(tick,1000);
setInterval(yukle,8000);
</script>
</body>
</html>
