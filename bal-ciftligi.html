<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bal Çiftliği</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#2b1d05;color:#fff6dc;font-family:-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
body{background:radial-gradient(circle at 50% 20%,#7a5510 0%,#2b1d05 70%) fixed;min-height:100%}
#app{padding:10px 10px 28px;max-width:520px;margin:0 auto}
.panel{background:rgba(35,22,4,.8);border:1px solid #8a6420;border-radius:16px;padding:10px;margin-bottom:10px}
.stats{display:flex;gap:8px}
.stat{flex:1;background:rgba(0,0,0,.25);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px;color:#ffd85a}
.stat span{font-size:11px;color:#ffe6a8}
.btn{background:linear-gradient(#ffd85a,#f2a81b);color:#2a1a02;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;margin:4px 4px 4px 0;cursor:pointer;box-shadow:0 2px 0 #b57a10}
.btn.ikincil{background:transparent;color:#fff6dc;border:1px solid #8a6420;box-shadow:none}
.btn:disabled{opacity:.45}
.muted{color:#e0c488;font-size:12px}
.bar{height:14px;background:rgba(0,0,0,.35);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd85a,#f2a81b);width:0%}
.cicekler{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:40px}
.cicekler span{font-size:20px}
.kovan{font-size:52px;text-align:center;line-height:1.1;margin:6px 0}
#hata{color:#ff9b7a;font-size:13px;min-height:18px;text-align:center}
#bilgi{color:#ffe066;font-size:13px;min-height:18px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div class="panel stats">
    <div class="stat"><b id="depo">0</b><span>🍯 Depo kg</span></div>
    <div class="stat"><b id="kovan">1</b><span>🐝 Kovan seviye</span></div>
    <div class="stat"><b id="cicekSay">0</b><span>🌼 Çiçek</span></div>
  </div>

  <div class="panel">
    <div class="kovan">🐝🍯</div>
    <div class="bar"><i id="barDepo"></i></div>
    <div class="muted" id="uretim"></div>
  </div>

  <div class="panel">
    <div class="muted">Çiçekler</div>
    <div class="cicekler" id="cicekler"></div>
  </div>

  <div class="panel">
    <button class="btn" id="btnSat">Bal sat</button>
    <button class="btn ikincil" id="btnKovan">Kovan yükselt</button>
    <button class="btn ikincil" id="btnCicek">Çiçek ek</button>
    <div class="muted" id="fiyat" style="margin-top:6px"></div>
  </div>

  <div class="panel muted">
    Pazar: 1 kg = 40 🪙 · Günlük satış limiti 5.000 🪙 · Her 50 kg satış 1 💎 verir.
  </div>

  <div id="bilgi"></div>
  <div id="hata"></div>
</div>

<script>
const CFG = window.ARI_CIFTLIK || null;
let d = null, alindi = 0, kilit = false;
const $ = (id) => document.getElementById(id);
function hata(m) { $('hata').textContent = m || ''; }
function bilgi(m) { $('bilgi').textContent = m || ''; clearTimeout(bilgi._t); bilgi._t = setTimeout(() => $('bilgi').textContent = '', 2400); }

async function rpc(ad, body) {
  if (!CFG) throw new Error('Oturum yok. Oyunu uygulamadan aç.');
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + ad, {
    method: 'POST',
    headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Hata ' + r.status));
  return j;
}

async function yukle() {
  try {
    d = await rpc('bal_durum');
    alindi = Date.now();
    hata('');
    ciz();
  } catch (e) { hata(e.message); }
}

// Depo, sunucu hesabına göre sürekli artar; ekranda saniyelik tahmin gösteriyoruz
function anlik() {
  if (!d) return 0;
  const gecen = (Date.now() - alindi) / 60000;
  return Math.min(d.kapasite, d.depo + gecen * d.dk_uretim);
}

function ciz() {
  if (!d) return;
  $('kovan').textContent = d.kovan;
  $('cicekSay').textContent = d.cicek;
  $('fiyat').textContent = '1 kg = ' + d.fiyat + ' 🪙 · Bugün satış: ' + d.gunluk_coin + '/' + d.gunluk_limit + ' 🪙';
  $('uretim').textContent = 'Dakikada +' + d.dk_uretim + ' kg · Kapasite ' + d.kapasite + ' kg';
  const cic = $('cicekler');
  cic.innerHTML = '';
  for (let i = 0; i < d.cicek; i++) {
    const s = document.createElement('span');
    s.textContent = ['🌼', '🌸', '🌻', '🌺'][i % 4];
    cic.appendChild(s);
  }
  $('btnKovan').textContent = 'Kovan yükselt (' + d.kovan_maliyet + ' 🪙)';
  $('btnKovan').disabled = d.kovan >= 10;
  $('btnCicek').textContent = 'Çiçek ek (' + d.cicek_maliyet + ' 🪙)';
  $('btnCicek').disabled = d.cicek >= 20;
}

// Ekranda depo sayısını akıcı göster
setInterval(() => {
  if (!d) return;
  const dep = anlik();
  $('depo').textContent = dep.toFixed(1);
  $('barDepo').style.width = Math.min(100, (dep / d.kapasite) * 100) + '%';
  $('btnSat').disabled = dep < 0.1;
}, 500);

async function eylem(ad, body, mesaj) {
  if (kilit) return;
  kilit = true;
  try {
    const s = await rpc(ad, body);
    if (mesaj) bilgi(typeof mesaj === 'function' ? mesaj(s) : mesaj);
  } catch (e) { hata(e.message); }
  kilit = false;
  await yukle();
}

$('btnSat').onclick = () => {
  const kg = Math.floor(anlik() * 10) / 10;
  eylem('bal_sat', { p_kg: kg }, (s) => '+' + s.coin + ' 🪙' + (s.elmas ? ' +' + s.elmas + ' 💎' : ''));
};
$('btnKovan').onclick = () => eylem('bal_kovan_yukselt', {}, 'Kovan yükseltildi');
$('btnCicek').onclick = () => eylem('bal_cicek_ek', {}, 'Çiçek eklendi');

yukle();
setInterval(yukle, 5000);
</script>
</body>
</html>
