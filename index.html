<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arı Çiftliği</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#2f6b2a;font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
#game{position:relative;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;background:linear-gradient(#3f8f3a 0,#4c9a3f 26%,#8fd14a 38%,#5fb02c 100%);transition:transform .5s cubic-bezier(.2,.8,.3,1)}
#game.zoom{transform:scale(1.035)}
#tint{position:absolute;inset:0;pointer-events:none;transition:background 3s ease;z-index:1}
.abs{position:absolute}
#path{position:absolute;left:-10%;right:-10%;top:23%;height:15%;background:#ecd08f;border-radius:50%}
#fence{position:absolute;left:0;right:0;top:35%;height:14px;background:repeating-linear-gradient(90deg,var(--fc,#7a4a22) 0 7px,transparent 7px 20px);border-top:4px solid var(--fc,#a56b33)}
#river{position:absolute;left:0;right:0;bottom:0;height:17%;background:linear-gradient(#5cbcee,#2f8fd0);border-radius:55% 55% 0 0/30% 30% 0 0}
.dec{position:absolute;line-height:1}
#farmer{position:absolute;right:14%;top:24%;font-size:34px;transition:left 4s linear,right 4s linear}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;z-index:5}
.av{width:46px;height:46px;border-radius:50%;background:#3b2415;border:3px solid #f6c344;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;z-index:2;position:relative}
.lvb{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#2f7d12;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;border:1px solid #fff}
.pill{height:34px;border-radius:17px;background:linear-gradient(#a8622a,#7a4218);border:2px solid #f6c344;color:#fff8e1;font-weight:800;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px}
#nmp{margin-left:-22px;padding-left:28px}
.gemp{background:linear-gradient(#6fd6e8,#1f8fae);border-color:#c8f6ff}
#xpwrap{flex-basis:100%;height:7px;background:rgba(0,0,0,.25);border-radius:5px;overflow:hidden;margin-top:2px}
#xpbar{height:100%;background:linear-gradient(90deg,#8fe04a,#3aa23a);width:0%;transition:width .4s}
.rb{width:52px;height:52px;border-radius:50%;background:radial-gradient(#ffe9a0,#f4b731);border:3px solid #fff2b8;box-shadow:0 3px 0 #b97a12;display:grid;place-items:center;font-size:26px;position:relative;cursor:pointer}
.rb small{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:#fff;background:#7a4218;padding:1px 7px;border-radius:8px;border:1px solid #f6c344;white-space:nowrap}
.rb:active{transform:scale(.94)}
.rb .dot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#e8402a;border:2px solid #fff;font-size:8px;color:#fff;display:none;place-items:center;font-weight:800}
.rb .dot.on{display:grid}
#side{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:20px;z-index:5}
#menu{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:0;right:0;display:flex;justify-content:space-around;padding:0 6px;z-index:5}
#offer{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 62px);background:linear-gradient(90deg,#e8402a,#f28a30);border:2px solid #fff2b8;border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:12px;z-index:5;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#offer button{margin-left:auto;background:#fff;color:#c8792f;border:0;border-radius:10px;padding:5px 10px;font-weight:800}
#field{position:absolute;left:50%;top:41%;width:342px;height:180px;transform:translateX(-50%)}
.plot{position:absolute;width:76px;height:38px;cursor:pointer;filter:drop-shadow(0 4px 0 rgba(60,30,10,.35))}
.tile{position:absolute;inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.locked .tile{background:radial-gradient(circle at 50% 40%,#b9ee78,#78c53c)}
.soil .tile{background:linear-gradient(#ab6e37,#7d4c22)}
.crop{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);text-align:center;line-height:1;pointer-events:none}
.crop .e{font-size:26px;display:block}
.crop .tm{font-size:9px;background:#3b2415;color:#fff;border-radius:6px;padding:1px 4px;margin-top:1px;display:inline-block}
.bub{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.ready .e{animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.fx{position:absolute;pointer-events:none;font-weight:800;z-index:40;white-space:nowrap}
.fx.num{animation:up .9s ease-out forwards;color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;font-size:15px}
.fx.spark{animation:pop .6s ease-out forwards;font-size:18px}
@keyframes up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-38px);opacity:0}}
@keyframes pop{0%{transform:scale(.4) translateY(0);opacity:1}70%{transform:scale(1.2) translateY(-14px);opacity:1}100%{transform:scale(1) translateY(-22px);opacity:0}}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
#ov.on{display:flex}
.wrap{position:relative;width:88%;max-height:78%;display:flex}
.box{width:100%;overflow:auto;background:#fff1c9;border:6px solid #c8792f;border-radius:20px;padding:36px 12px 14px;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.ttl{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:linear-gradient(#e89a45,#c8792f);color:#fff;font-weight:800;padding:8px 26px;border-radius:14px;border:3px solid #8a4b18;font-size:18px;text-shadow:0 2px 0 #7a4218;white-space:nowrap;z-index:2}
.x{position:absolute;right:-10px;top:-14px;width:34px;height:34px;border-radius:50%;background:#f28a30;color:#fff;border:3px solid #fff2b8;font-weight:900;z-index:2}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:10px;background:#f4d38a;color:#7a4b1d;font-weight:800;font-size:12px;border:2px solid transparent}
.tab.on{background:#4bb51f;color:#fff;border-color:#2f7d12}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{background:linear-gradient(#ffd45c,#f6a51c);border-radius:14px;padding:8px 4px;text-align:center;font-weight:800;color:#5a3210;border:3px solid transparent}
.it .e{font-size:30px}
.it.sel{border-color:#3aa23a}
.it.own{border-color:#3aa23a}
.row{display:flex;align-items:center;gap:8px;background:#ffe7a8;border:2px solid #e3b25a;border-radius:14px;padding:8px;margin-bottom:8px;color:#5a3210;font-weight:700}
.row .t{flex:1;font-size:13px}
.btn{background:linear-gradient(#8fe04a,#4bb51f);color:#fff;border:0;border-radius:12px;padding:8px 12px;font-weight:800;box-shadow:0 3px 0 #2f7d12}
.btn:disabled{background:#bbb;box-shadow:0 3px 0 #888}
.hint{font-size:12px;color:#7a4b1d;text-align:center;margin:10px 0 0}
.pbar{height:8px;background:#e3c185;border-radius:5px;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#8fe04a,#3aa23a)}
.badge{background:#fff8e6;border:2px solid #e3b25a;border-radius:14px;padding:8px;text-align:center;color:#5a3210}
.badge.done{border-color:#3aa23a;background:#eafce0}
#toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 16px;border-radius:18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;white-space:nowrap;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style></head><body>
<div id="game">
 <div id="tint"></div>
 <div id="path"></div><div id="fence"></div><div id="river"></div>
 <div class="dec" style="left:-2%;top:4%;font-size:54px">🌳</div>
 <div class="dec" style="right:14%;top:5%;font-size:46px">🌳</div>
 <div class="dec" style="left:46%;top:17%;font-size:30px">🌻🌻</div>
 <div id="farmer" class="dec">🧑‍🌾</div>
 <div class="dec" style="right:2%;bottom:22%;font-size:30px">🌼</div>
 <svg class="abs" style="left:2%;top:9%;width:36%" viewBox="0 0 120 100"><rect x="18" y="45" width="84" height="50" rx="3" fill="#d9403a"/><rect x="18" y="45" width="84" height="6" fill="#fff" opacity=".6"/><polygon id="roof" points="6,50 60,8 114,50" fill="#f2b632" stroke="#c98a12" stroke-width="4" stroke-linejoin="round"/><path d="M46 95V68q14-14 28 0v27z" fill="#fff"/><rect x="26" y="58" width="14" height="12" fill="#fff"/></svg>
 <div id="hud">
  <div class="av" id="av"><span id="avc">Ç</span><span class="lvb" id="lvb">Lv1</span></div>
  <div class="pill" id="nmp"><span id="nm">ÇİFTÇİ</span></div>
  <div class="pill" id="cnp">🪙 <span id="coin">0</span></div>
  <div class="pill gemp" id="gmp">💎 <span id="gem">0</span></div>
  <div class="pill" id="sp" style="padding:0 10px" onclick="show('bag')">🌱 <span id="sel"></span></div>
  <div class="pill" id="mp" style="padding:0 10px;cursor:pointer" onclick="toggleMusic()"><span id="mIcon">🔇</span></div>
  <div id="xpwrap"><div id="xpbar"></div></div>
 </div>
 <div id="offer" style="display:none">
  <span id="offtxt"></span><button onclick="buyOffer()">Al</button>
 </div>
 <div id="side">
  <div class="rb" onclick="show('board')">🏆<small>Sıralama</small></div>
  <div class="rb" onclick="show('steal')">✋<small>Çal</small></div>
 </div>
 <div id="field"></div>
 <div id="menu">
  <div class="rb" onclick="show('bag')">🎒<small>Çanta</small></div>
  <div class="rb" onclick="show('store')">🏚️<small>Depo</small></div>
  <div class="rb" onclick="show('orders')">🚚<small>Sipariş</small></div>
  <div class="rb" onclick="show('shop')">🏪<small>Mağaza</small></div>
  <div class="rb" onclick="show('gift')">🎁<small>Ödül</small><span class="dot" id="gdot"></span></div>
 </div>
 <div id="ov"><div class="wrap"><div class="ttl" id="ttl"></div><button class="x" onclick="closeM()">✕</button><div class="box" id="bx"></div></div></div>
 <div id="toast"></div>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
try{if(tg){tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor('#3f8f3a')}}catch(e){}
const $=id=>document.getElementById(id);
const SEEDS={
 aycicegi:{n:'Ayçiçeği',e:'🌻',min:5,y:4,price:8,rate:5,lvl:1},
 misir:{n:'Mısır',e:'🌽',min:15,y:6,price:6,rate:4,lvl:2},
 kahve:{n:'Kahve',e:'☕',min:30,y:8,price:10,rate:7,lvl:3}};
const COSTUMES={def:{n:'Varsayılan',e:'🧑‍🌾',cost:0},hat:{n:'Hasat Şapkası',e:'👨‍🌾',cost:40},party:{n:'Şenlik',e:'🥳',cost:80}};
const FENCES={def:{n:'Ahşap',c:'#7a4a22',cost:0},red:{n:'Kızıl',c:'#b33a3a',cost:60},blue:{n:'Mavi',c:'#2f6fae',cost:60}};
const ROOFS={def:{n:'Sarı',c:'#f2b632',cost:0},green:{n:'Yeşil',c:'#5fae6f',cost:60},pink:{n:'Pembe',c:'#c85fae',cost:60}};
const BADGE_T=[10,50,150];
const ACH_LIST=[
 {id:'harvest1',d:'İlk hasadını yap',e:'🌱',goal:1,get p(){return S.stats.harvestCount},rw:{coins:20}},
 {id:'harvest10',d:'10 kez hasat et',e:'🌾',goal:10,get p(){return S.stats.harvestCount},rw:{coins:50,gems:2}},
 {id:'harvest100',d:'100 kez hasat et',e:'🏅',goal:100,get p(){return S.stats.harvestCount},rw:{coins:300,gems:10}},
 {id:'plotsAll',d:'Tüm 20 parseli aç',e:'🗺️',goal:20,get p(){return S.plots.filter(x=>x.s!='l').length},rw:{gems:20}},
 {id:'lvl5',d:'Seviye 5\'e ulaş',e:'⭐',goal:5,get p(){return S.level},rw:{gems:10}},
 {id:'lvl10',d:'Seviye 10\'a ulaş',e:'🌟',goal:10,get p(){return S.level},rw:{gems:25}},
 {id:'coins1000',d:'Toplamda 1000 🪙 kazan',e:'💰',goal:1000,get p(){return S.stats.coinsEarned},rw:{gems:8}},
 {id:'badgeAny',d:'Herhangi bir ürün rozeti kazan',e:'🏆',goal:1,get p(){return Object.keys(SEEDS).some(k=>(S.badges[k]||0)>=BADGE_T[0])?1:0},rw:{coins:40}}];
function checkAch(){let any=0;ACH_LIST.forEach(a=>{if(!S.ach[a.id]&&a.p>=a.goal)any=1});if(any)save()}
const K='farm_v2',R=[10,10,20,20,30];
function mk(n,e){const c=Object.keys(SEEDS)[Math.floor(Math.random()*3)],need=6+Math.floor(Math.random()*9);return{n,e,c,need,rw:Math.round(need*SEEDS[c].rate*1.2)}}
function freshMissions(){return{date:day(0),goals:{harvest:3+Math.floor(Math.random()*4),plant:3+Math.floor(Math.random()*4),sell:1+Math.floor(Math.random()*2)},prog:{harvest:0,plant:0,sell:0},claimed:{harvest:false,plant:false,sell:false}}}
function fresh(){return{coins:200,gems:10,sel:'misir',seeds:{misir:5,kahve:3,aycicegi:3},crops:{},
 plots:Array.from({length:20},(_,i)=>({s:i<8?'e':'l',id:null,at:0,cost:100+Math.max(0,i-8)*60})),
 orders:[mk('Restoran','🍽️'),mk('Okul','🏫'),mk('Otel','🏨'),mk('AVM','🏬')],
 daily:{last:'',streak:0},xp:0,level:1,badges:{},
 decor:{fence:'def',roof:'def',costume:'def'},owned:{fence:['def'],roof:['def'],costume:['def']},
 missions:freshMissions(),offer:{date:'',bought:false},music:false,
 stats:{harvestCount:0,plantCount:0,sellCount:0,coinsEarned:0},ach:{},referredBy:null}}
let S,isNew=false;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.plots||S.plots.length!=20){S=fresh();isNew=true}
// eski kayıtlara yeni alanları güvenli şekilde ekle
{const f=fresh();for(const k in f)if(!(k in S))S[k]=f[k];
 if(!S.badges)S.badges={};if(!S.decor)S.decor=f.decor;if(!S.owned)S.owned=f.owned;
 if(!S.decor.costume)S.decor.costume='def';if(!S.owned.costume)S.owned.costume=['def'];
 if(typeof S.music!=='boolean')S.music=false;
 if(!S.missions||S.missions.date!==day(0))S.missions=freshMissions();
 if(!S.offer||S.offer.date!==day(0))S.offer={date:day(0),bought:false};
 if(!S.stats)S.stats=f.stats;if(!S.ach)S.ach={};if(!('referredBy'in S))S.referredBy=null;
 if(!S.stolenToday)S.stolenToday={};}
function day(o){return new Date(Date.now()-o*864e5).toISOString().slice(0,10)}
// ---- davetle gelen yeni oyuncuya hoşgeldin bonusu ----
(function(){try{const sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;
 if(isNew&&sp&&sp.indexOf('ref_')===0){S.coins+=100;S.gems+=10;S.referredBy=sp;save();
 setTimeout(()=>toast('🎉 Davet bonusu: +100 🪙 +10 💎'),600)}}catch(e){}})();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
function ask(m,cb){if(tg&&tg.showConfirm&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.2'))tg.showConfirm(m,ok=>ok&&cb());else if(confirm(m))cb()}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function hap(t){try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}}
// ---- ses (Web Audio, dosyasız) ----
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function beep(freq,dur,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||.05;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.stop(a.currentTime+dur)}
function sfxPlant(){beep(520,.08,'triangle',.04);setTimeout(()=>beep(660,.08,'triangle',.04),60)}
function sfxHarvest(){beep(700,.07,'square',.04);setTimeout(()=>beep(900,.09,'square',.05),70)}
function sfxCoin(){beep(1100,.05,'square',.05);setTimeout(()=>beep(1400,.08,'square',.05),50)}
function sfxLevel(){[600,800,1000,1300].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.06),i*90))}
function sfxLock(){beep(220,.15,'sawtooth',.04)}
// ---- efektler (uçan sayı / kıvılcım) ----
function fxAt(el,cls,txt){const g=$('game'),gr=g.getBoundingClientRect(),r=el.getBoundingClientRect();
 const s=document.createElement('div');s.className='fx '+cls;s.textContent=txt;
 s.style.left=(r.left-gr.left+r.width/2-10)+'px';s.style.top=(r.top-gr.top+8)+'px';
 g.appendChild(s);setTimeout(()=>s.remove(),950)}
// ---- gün/gece tonu ----
function tint(){const h=new Date().getHours();let c;
 if(h>=6&&h<10)c='rgba(255,210,120,.10)';else if(h>=10&&h<17)c='rgba(255,255,255,0)';
 else if(h>=17&&h<20)c='rgba(255,120,60,.16)';else c='rgba(10,15,60,.38)';
 $('tint').style.background=c}
setInterval(tint,60000);tint();
// ---- mevsim (aya göre sabit renk filtresi) ----
function season(){const m=new Date().getMonth();let f;
 if(m>=2&&m<=4)f='saturate(1.05) hue-rotate(0deg)';
 else if(m>=5&&m<=7)f='saturate(1.2) brightness(1.04)';
 else if(m>=8&&m<=10)f='saturate(.9) hue-rotate(-8deg) sepia(.08)';
 else f='saturate(.75) hue-rotate(6deg) brightness(.96)';
 $('game').style.filter=f}
season();
// ---- parsel açılışında kamera zoom hissi ----
function pulseZoom(){const g=$('game');g.classList.add('zoom');setTimeout(()=>g.classList.remove('zoom'),380)}
// ---- arka plan müziği (basit döngü, dosyasız) ----
let mNodes=null,mTimer=null;
function musicStep(){const a=ac();if(!a)return;const notes=[261.6,329.6,392,293.7];const n=notes[Math.floor(Date.now()/2000)%4];
 const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=n/2;g.gain.value=.02;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+1.8);o.stop(a.currentTime+1.8)}
function toggleMusic(){S.music=!S.music;save();$('mIcon').textContent=S.music?'🎵':'🔇';
 if(S.music){ac();musicStep();mTimer=setInterval(musicStep,2000)}else if(mTimer){clearInterval(mTimer);mTimer=null}}
// ---- çiftçi dolaşma ----
function roam(){const f=$('farmer'),left=Math.random()<.5,e=COSTUMES[S.decor.costume].e;f.style.right=left?'auto':(8+Math.random()*70)+'%';f.style.left=left?(8+Math.random()*70)+'%':'auto';f.textContent=Math.random()<.5?e:'🌾'+e}
setInterval(roam,6000);
// ---- XP / seviye ----
function xpNeed(l){return l*100}
// ---- Supabase bağlantısı (Sıralama / Çal) ----
const SB_URL='https://ooxqvlnllwxswloupwff.supabase.co';
const SB_KEY='sb_publishable_oehf6hohWkBXVHOB0_7qrw_gaV1cYs3';
function sbHeaders(extra){return Object.assign({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},extra||{})}
function myUid(){if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id)return String(tg.initDataUnsafe.user.id);
 if(!S.localUid){S.localUid='local_'+Math.random().toString(36).slice(2);save()}return S.localUid}
function myName(){const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;return(u&&u.first_name)||'Çiftçi'}
async function syncUp(){try{await fetch(SB_URL+'/rest/v1/players',{method:'POST',headers:sbHeaders({Prefer:'resolution=merge-duplicates'}),
 body:JSON.stringify([{id:myUid(),username:myName(),coins:S.coins,level:S.level,
  state:{plots:S.plots.map(p=>({s:p.s,id:p.id,at:p.at}))},updated_at:new Date().toISOString()}])})}catch(e){}}
setInterval(syncUp,30000);
const EDGE_URL='https://ooxqvlnllwxswloupwff.supabase.co/functions/v1/swift-responder';
const STAR_PACKS={
 pack_s:{stars:50,gems:50,label:'50 💎'},
 pack_m:{stars:100,gems:120,label:'120 💎'},
 pack_l:{stars:220,gems:300,label:'300 💎'}};
async function refreshGems(){
 try{const r=await fetch(SB_URL+'/rest/v1/players?id=eq.'+encodeURIComponent(myUid())+'&select=gems',{headers:sbHeaders()});
  const rows=await r.json();if(Array.isArray(rows)&&rows[0]){S.gems=rows[0].gems||0;save();updHud()}}catch(e){}}
async function buyGems(sku){
 if(!tg||!tg.openInvoice){toast('Bu özellik yalnızca Telegram içinde çalışır');return}
 toast('Fatura hazırlanıyor…');
 try{
  const r=await fetch(EDGE_URL,{method:'POST',headers:sbHeaders(),body:JSON.stringify({uid:myUid(),sku})});
  const data=await r.json();
  if(!data.link){toast('Hata: '+(data.error||'bilinmeyen'));return}
  tg.openInvoice(data.link,(status)=>{
   if(status==='paid'){toast('💎 Ödeme alındı! Elmasların yükleniyor…');setTimeout(refreshGems,2500);setTimeout(refreshGems,6000)}
   else if(status==='failed'){toast('Ödeme başarısız oldu')}
  });
 }catch(e){toast('Bağlantı hatası, tekrar dene')}}
async function loadBoard(){open('Sıralama','<p class="hint">Yükleniyor…</p>');
 try{const r=await fetch(SB_URL+'/rest/v1/players?select=username,coins,level&order=coins.desc&limit=10',{headers:sbHeaders()});
  const list=await r.json();
  const html=(Array.isArray(list)&&list.length)?'<div class="grid" style="grid-template-columns:1fr">'+list.map((p,i)=>
   '<div class="row"><b style="width:22px">#'+(i+1)+'</b><div class="t">'+(p.username||'Çiftçi')+'<br><small>Seviye '+p.level+'</small></div><b>'+p.coins+' 🪙</b></div>').join('')+'</div>'
   :'<p class="hint">Henüz kimse kayıtlı değil. Birkaç dakika oynayıp tekrar bak.</p>';
  open('Sıralama',html)}catch(e){open('Sıralama','<p class="hint">Bağlantı hatası. Az sonra tekrar dene.</p>')}}
async function loadSteal(){open('Çal','<p class="hint">Yükleniyor…</p>');
 try{const r=await fetch(SB_URL+'/rest/v1/players?select=id,username,level,state&order=updated_at.desc&limit=20',{headers:sbHeaders()});
  const all=await r.json(),uid=myUid();
  const list=(Array.isArray(all)?all:[]).filter(p=>String(p.id)!==uid);
  if(!list.length){open('Çal','<p class="hint">Henüz başka oyuncu yok. Arkadaşını davet et!</p>');return}
  const today=day(0);
  const html='<div class="grid" style="grid-template-columns:1fr">'+list.slice(0,10).map(p=>{
   const done=S.stolenToday&&S.stolenToday[p.id]===today;
   const plots=(p.state&&p.state.plots)||[];
   const ready=plots.filter(pl=>pl.s=='g'&&pl.id&&SEEDS[pl.id]&&(Date.now()-pl.at)/1000>=SEEDS[pl.id].min*60).length;
   return'<div class="row"><div class="t"><b>'+(p.username||'Çiftçi')+'</b><br><small>Seviye '+p.level+' · '+ready+' hazır ürün</small></div><button class="btn" '+((!ready||done)?'disabled':'')+' onclick="stealFrom(\''+p.id+'\')">'+(done?'Bugün çaldın':'✋ Çal')+'</button></div>'}).join('')+'</div>';
  open('Çal',html)}catch(e){open('Çal','<p class="hint">Bağlantı hatası. Az sonra tekrar dene.</p>')}}
function stealFrom(targetId){if(!S.stolenToday)S.stolenToday={};const today=day(0);if(S.stolenToday[targetId]===today)return;
 const rw=8+Math.floor(Math.random()*13);S.coins+=rw;S.stats.coinsEarned+=rw;S.stolenToday[targetId]=today;
 sfxCoin();upd();checkAch();toast('✋ +'+rw+' 🪙 çaldın!');loadSteal()}
function addXp(n){S.xp+=n;let up=0;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;S.gems+=5;up=1;
  const lp=S.plots.find(p=>p.s=='l');if(lp){lp.s='e';toast('🎉 Seviye '+S.level+'! Yeni parsel açıldı + 5 💎')}else toast('🎉 Seviye '+S.level+'! +5 💎')}
 if(up){sfxLevel();pulseZoom()}}
// ---- görsel yeniden çizim ----
const F=$('field'),els=[];
S.plots.forEach((p,i)=>{const r=Math.floor(i/5),c=i%5,d=document.createElement('div');
 d.className='plot';d.style.left=((c-r)*38+114)+'px';d.style.top=((c+r)*19)+'px';d.style.zIndex=r+c;
 d.innerHTML='<div class="tile"></div><div class="crop"></div>';d.onclick=()=>tapPlot(i);F.appendChild(d);els.push(d)});
function paint(){const now=Date.now();let ch=0;
 S.plots.forEach((p,i)=>{const d=els[i],cr=d.lastChild;let cls='plot ',h='';
  if(p.s=='l'){cls+='locked';h='<span class="e" style="font-size:16px;opacity:.8">🔒</span>'}
  else{cls+='soil';
   if(p.s=='g'){const sd=SEEDS[p.id],tot=sd.min*60,el=(now-p.at)/1000;
    if(el>=tot){p.s='r';ch=1}else h='<span class="bub">⚡</span><span class="e">'+(el/tot<.5?'🌱':'🌿')+'</span><span class="tm">'+sd.e+' '+fmt(tot-el)+'</span>'}
   if(p.s=='r'){cls+=' ready';h='<span class="bub">✋</span><span class="e">'+SEEDS[p.id].e+'</span>'}}
  d.className=cls;if(cr.dataset.h!==h){cr.dataset.h=h;cr.innerHTML=h}});
 if(ch)save()}
function updHud(){$('coin').textContent=S.coins;$('gem').textContent=S.gems;
 $('sel').textContent=SEEDS[S.sel].e+'×'+(S.seeds[S.sel]||0);
 $('lvb').textContent='Lv'+S.level;$('xpbar').style.width=Math.min(100,100*S.xp/xpNeed(S.level))+'%';
 document.documentElement.style.setProperty('--fc',FENCES[S.decor.fence].c);
 $('roof').setAttribute('fill',ROOFS[S.decor.roof].c);
 const mDone=Object.keys(S.missions.goals).some(k=>S.missions.prog[k]>=S.missions.goals[k]&&!S.missions.claimed[k]);
 $('gdot').classList.toggle('on',mDone||S.daily.last!==day(0))}
function upd(){save();paint();updHud();syncUp()}
function mprog(t){S.missions.prog[t]=Math.min(S.missions.goals[t],(S.missions.prog[t]||0)+1)}
function tapPlot(i){const p=S.plots[i];
 if(p.s=='l')return ask('Bu araziyi '+p.cost+' 🪙 ile açalım mı?',()=>{if(S.coins<p.cost)return toast('Yeterli paran yok');S.coins-=p.cost;p.s='e';sfxLock();pulseZoom();upd()});
 if(p.s=='e'){const k=S.sel;if(!S.seeds[k])return toast('Tohum yok. Mağazadan al');S.seeds[k]--;p.s='g';p.id=k;p.at=Date.now();
  sfxPlant();fxAt(els[i],'spark','🌱');toast(SEEDS[k].e+' '+SEEDS[k].n+' ekildi');mprog('plant');S.stats.plantCount++;return upd()}
 if(p.s=='g')return ask('10 dk hızlandır: 20 🪙',()=>{if(S.coins<20)return toast('Yeterli paran yok');S.coins-=20;p.at-=600000;upd()});
 if(p.s=='r'){const lucky=Math.random()<.12,y=SEEDS[p.id].y*(lucky?2:1),cid=p.id;S.crops[cid]=(S.crops[cid]||0)+y;S.badges[cid]=(S.badges[cid]||0)+y;
  fxAt(els[i],'num',(lucky?'🍀 ':'')+'+'+y+' '+SEEDS[cid].e);fxAt(els[i],'spark',lucky?'🍀':'✨');sfxHarvest();
  toast((lucky?'🍀 Şanslı hasat! ':'')+SEEDS[cid].e+' +'+y+' '+SEEDS[cid].n+' depoya eklendi');addXp(y*2);mprog('harvest');S.stats.harvestCount++;
  p.s='e';p.id=null;upd();checkAch();hap('success')}}
let cur=null;
function open(t,h){$('ttl').textContent=t;$('bx').innerHTML=h;$('ov').classList.add('on')}
function closeM(){$('ov').classList.remove('on');cur=null}
function show(k){cur=k;if(k=='board')return loadBoard();if(k=='steal')return loadSteal();M[k]()}
function pick(k){S.sel=k;upd();closeM();toast(SEEDS[k].e+' '+SEEDS[k].n+' seçildi. Boş araziye dokun')}
function buy(k,n){if(S.level<SEEDS[k].lvl)return toast('Bu tohum Seviye '+SEEDS[k].lvl+'\'de açılıyor');const c=SEEDS[k].price*n;if(S.coins<c)return toast('Yeterli paran yok');S.coins-=c;S.seeds[k]=(S.seeds[k]||0)+n;sfxCoin();upd();show('shop')}
function sell(i){const o=S.orders[i];if((S.crops[o.c]||0)<o.need)return;S.crops[o.c]-=o.need;S.coins+=o.rw;S.stats.coinsEarned+=o.rw;S.orders[i]=mk(o.n,o.e);
 sfxCoin();mprog('sell');S.stats.sellCount++;upd();checkAch();show('orders');toast('+'+o.rw+' 🪙 kazandın')}
function claimLogin(){const d=S.daily;if(d.last==day(0))return;const ns=d.last==day(1)?d.streak+1:1;const rw=R[(ns-1)%5];S.coins+=rw;S.stats.coinsEarned+=rw;d.last=day(0);d.streak=ns;sfxCoin();upd();checkAch();show('gift')}
function claimMission(t){if(S.missions.prog[t]<S.missions.goals[t]||S.missions.claimed[t])return;
 S.missions.claimed[t]=true;const rw=8+S.missions.goals[t]*4;S.coins+=rw;S.stats.coinsEarned+=rw;S.gems+=2;sfxCoin();upd();checkAch();show('gift')}
function buyDecor(cat,key){const D=cat=='fence'?FENCES:cat=='roof'?ROOFS:COSTUMES,item=D[key];
 if(!S.owned[cat].includes(key)){if(S.gems<item.cost)return toast('Yeterli elmasın yok');S.gems-=item.cost;S.owned[cat].push(key)}
 S.decor[cat]=key;upd();show('shop')}
function claimAch(id){const a=ACH_LIST.find(x=>x.id==id);if(!a||S.ach[id]||a.p<a.goal)return;
 S.ach[id]=true;if(a.rw.coins){S.coins+=a.rw.coins;S.stats.coinsEarned+=a.rw.coins}if(a.rw.gems)S.gems+=a.rw.gems;
 sfxLevel();upd();show('gift');toast('🏆 Başarım: '+a.d)}
let offTab='seed';
function buyOffer(){if(S.offer.bought)return;if(S.coins<120)return toast('Yeterli paran yok');S.coins-=120;
 Object.keys(SEEDS).forEach(k=>S.seeds[k]=(S.seeds[k]||0)+4);S.gems+=6;S.offer.bought=true;sfxCoin();upd();renderOffer();toast('Fırsat paketi alındı!')}
function renderOffer(){const o=$('offer');if(S.offer.bought){o.style.display='none';return}
 o.style.display='flex';$('offtxt').textContent='🔥 Fırsat: 4×tohum(hepsi)+6💎 — 120 🪙';}
function inviteLink(){const uid=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id)||'x';
 return 'https://t.me/SancakAriCiftligiBot?startapp=ref_'+uid}
function invite(){const link=inviteLink(),txt='Arı Çiftliği\'nde bana katıl, birlikte ekelim! 🌻';
 const shareUrl='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(txt);
 try{tg&&tg.openTelegramLink?tg.openTelegramLink(shareUrl):window.open(shareUrl,'_blank')}catch(e){window.open(shareUrl,'_blank')}}
let gTab='login';
const M={
 bag(){open('Sırt Çantası','<div class="grid">'+Object.keys(SEEDS).map(k=>'<div class="it'+(S.sel==k?' sel':'')+'" onclick="pick(\''+k+'\')"><div class="e">'+SEEDS[k].e+'</div>×'+(S.seeds[k]||0)+'<br><small>'+SEEDS[k].n+'</small></div>').join('')+'</div><p class="hint">Bir tohuma dokun, sonra boş araziye dokunarak ek.</p>')},
 store(){const ks=Object.keys(S.crops).filter(k=>S.crops[k]>0);open('Depo',ks.length?'<div class="grid">'+ks.map(k=>'<div class="it"><div class="e">'+SEEDS[k].e+'</div>×'+S.crops[k]+'<br><small>'+SEEDS[k].n+'</small></div>').join('')+'</div>':'<p class="hint">Depo boş. Hasat ettiğin ürünler burada birikir.</p>')},
 shop(){const seedHtml=Object.keys(SEEDS).map(k=>{const s=SEEDS[k],lock=S.level<s.lvl;return'<div class="row"><span style="font-size:30px;opacity:'+(lock?'.4':'1')+'">'+s.e+'</span><div class="t">'+s.n+' tohumu'+(lock?' <b>(Sv.'+s.lvl+')</b>':'')+'<br>'+s.min+' dk · '+s.y+' ürün</div><button class="btn" '+(lock?'disabled':'')+' onclick="buy(\''+k+'\',1)">'+s.price+' 🪙</button><button class="btn" '+(lock?'disabled':'')+' onclick="buy(\''+k+'\',5)">×5</button></div>'}).join('');
  const decorHtml='<p class="hint" style="margin-top:0">Çit rengi</p><div class="grid">'+Object.keys(FENCES).map(k=>{const f=FENCES[k],own=S.owned.fence.includes(k);return'<div class="it'+(S.decor.fence==k?' sel':own?' own':'')+'" onclick="buyDecor(\'fence\',\''+k+'\')"><div class="e" style="color:'+f.c+'">⬛</div>'+f.n+'<br><small>'+(own?'Sahipsin':f.cost+' 💎')+'</small></div>'}).join('')+
   '</div><p class="hint">Ahır rengi</p><div class="grid">'+Object.keys(ROOFS).map(k=>{const f=ROOFS[k],own=S.owned.roof.includes(k);return'<div class="it'+(S.decor.roof==k?' sel':own?' own':'')+'" onclick="buyDecor(\'roof\',\''+k+'\')"><div class="e" style="color:'+f.c+'">▲</div>'+f.n+'<br><small>'+(own?'Sahipsin':f.cost+' 💎')+'</small></div>'}).join('')+'</div>';
  const costHtml='<p class="hint" style="margin-top:0">Çiftçi kıyafeti</p><div class="grid">'+Object.keys(COSTUMES).map(k=>{const c=COSTUMES[k],own=S.owned.costume.includes(k);return'<div class="it'+(S.decor.costume==k?' sel':own?' own':'')+'" onclick="buyDecor(\'costume\',\''+k+'\')"><div class="e">'+c.e+'</div>'+c.n+'<br><small>'+(own?'Sahipsin':c.cost+' 💎')+'</small></div>'}).join('')+'</div>';
  const starsHtml='<p class="hint" style="margin-top:0">Telegram Stars ile gerçek elmas satın al.</p>'+Object.keys(STAR_PACKS).map(k=>{const sp=STAR_PACKS[k];return'<div class="row"><span style="font-size:28px">💎</span><div class="t">'+sp.label+'</div><button class="btn" onclick="buyGems(\''+k+'\')">⭐ '+sp.stars+'</button></div>'}).join('');
  open('Mağaza','<div class="tabs"><div class="tab'+(offTab=='seed'?' on':'')+'" onclick="offTab=\'seed\';show(\'shop\')">Tohum</div><div class="tab'+(offTab=='decor'?' on':'')+'" onclick="offTab=\'decor\';show(\'shop\')">Dekor</div><div class="tab'+(offTab=='cost'?' on':'')+'" onclick="offTab=\'cost\';show(\'shop\')">Kıyafet</div><div class="tab'+(offTab=='stars'?' on':'')+'" onclick="offTab=\'stars\';show(\'shop\')">💎</div></div>'+(offTab=='seed'?seedHtml:offTab=='decor'?decorHtml:offTab=='cost'?costHtml:starsHtml))},
 orders(){open('Sipariş',S.orders.map((o,i)=>{const h=S.crops[o.c]||0;return'<div class="row"><span style="font-size:30px">'+o.e+'</span><div class="t">'+o.n+'<br>'+SEEDS[o.c].e+' '+h+'/'+o.need+' → '+o.rw+' 🪙</div><button class="btn" '+(h<o.need?'disabled':'')+' onclick="sell('+i+')">Sat</button></div>'}).join(''))},
 gift(){const d=S.daily,got=d.last==day(0),n=got?(d.streak-1)%5+1:d.streak%5;
  const loginHtml='<div class="grid" style="grid-template-columns:repeat(5,1fr);gap:6px">'+R.map((r,i)=>'<div class="it'+(i<n?' sel':'')+'" style="padding:8px 0"><small>Gün '+(i+1)+'</small><br>🪙 '+r+'</div>').join('')+'</div><p style="text-align:center"><button class="btn" '+(got?'disabled':'')+' onclick="claimLogin()">'+(got?'Bugün alındı':'Ödülü al')+'</button></p><p class="hint">Ödül almak için her gün gir.</p>';
  const mm=S.missions,labels={harvest:'kez hasat et',plant:'kez ekim yap',sell:'kez sipariş tamamla'};
  const missHtml=Object.keys(mm.goals).map(t=>{const g=mm.goals[t],pr=mm.prog[t],done=pr>=g,cl=mm.claimed[t];
   return'<div class="row" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between"><b>'+pr+'/'+g+' '+labels[t]+'</b><button class="btn" '+((!done||cl)?'disabled':'')+' onclick="claimMission(\''+t+'\')">'+(cl?'Alındı':'Al')+'</button></div><div class="pbar"><i style="width:'+Math.min(100,100*pr/g)+'%"></i></div></div>'}).join('');
  const bHtml='<div class="grid">'+Object.keys(SEEDS).map(k=>{const tot=S.badges[k]||0,tier=BADGE_T.filter(t=>tot>=t).length;
   return'<div class="badge'+(tier?' done':'')+'"><div class="e" style="font-size:28px">'+SEEDS[k].e+'</div>'+SEEDS[k].n+'<br><small>'+tot+' toplam</small><br><small>'+(tier?'⭐'.repeat(tier):'Rozet yok')+'</small></div>'}).join('')+'</div><p class="hint">10 / 50 / 150 toplam hasatta rozet kazanılır.</p>';
  const aHtml='<div class="grid" style="grid-template-columns:1fr">'+ACH_LIST.map(a=>{const done=S.ach[a.id],can=a.p>=a.goal;
   return'<div class="row" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between"><b>'+a.e+' '+a.d+'</b><button class="btn" '+((!can||done)?'disabled':'')+' onclick="claimAch(\''+a.id+'\')">'+(done?'Alındı':'Al')+'</button></div><div class="pbar"><i style="width:'+Math.min(100,100*a.p/a.goal)+'%"></i></div><small>'+Math.min(a.p,a.goal)+'/'+a.goal+'</small></div>'}).join('')+'</div>';
  const inviteHtml='<p class="hint" style="margin-top:0">Arkadaşını davet et, katılınca ona +100 🪙 +10 💎 hoşgeldin bonusu verilir.</p><p style="text-align:center"><button class="btn" onclick="invite()">📤 Davet Linkini Paylaş</button></p><p class="hint">Not: davet eden kişiye (sana) ödül verilmesi bir sunucu gerektirir, o modül henüz kurulmadı.</p>';
  open('Ödüller','<div class="tabs"><div class="tab'+(gTab=='login'?' on':'')+'" onclick="gTab=\'login\';show(\'gift\')">Giriş</div><div class="tab'+(gTab=='mission'?' on':'')+'" onclick="gTab=\'mission\';show(\'gift\')">Görev</div><div class="tab'+(gTab=='badge'?' on':'')+'" onclick="gTab=\'badge\';show(\'gift\')">Rozet</div><div class="tab'+(gTab=='ach'?' on':'')+'" onclick="gTab=\'ach\';show(\'gift\')">Başarım</div><div class="tab'+(gTab=='invite'?' on':'')+'" onclick="gTab=\'invite\';show(\'gift\')">Davet</div></div>'+(gTab=='login'?loginHtml:gTab=='mission'?missHtml:gTab=='badge'?bHtml:gTab=='ach'?aHtml:inviteHtml))}};
const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,nm=(u&&u.first_name)||'ÇİFTÇİ';
$('nm').textContent=nm.toUpperCase().slice(0,12);$('avc').textContent=nm[0].toUpperCase();
upd();renderOffer();$('mIcon').textContent=S.music?'🎵':'🔇';setInterval(paint,1000);
</script></body></html>
