<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arı Çiftliği</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--tg-theme-bg-color, #eaf6d8); color: var(--tg-theme-text-color, #2f4f1f); font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif; overscroll-behavior: none; }
#app { display: flex; flex-direction: column; height: 100%; }
h1 { text-align: center; font-size: 18px; margin: 10px 0; color: #4a7c59; }
.seed-bar { display: flex; justify-content: center; gap: 8px; padding: 4px 8px 10px; }
.seed-btn { display: flex; flex-direction: column; align-items: center; background: #fff; border: 2px solid transparent; border-radius: 12px; cursor: pointer; padding: 6px 10px; font-size: 12px; }
.seed-btn.active { border-color: #f5a623; background: #fff3d6; }
.seed-btn .icon { font-size: 20px; }
.grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 12px 24px; overflow-y: auto; }
.plot { aspect-ratio: 1 / 1; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: transform 0.1s ease; }
.plot:active { transform: scale(0.95); }
.plot.locked { background: #c9c9c9; }
.plot.locked .lock { font-size: 22px; }
.plot.empty { background: #8b5a2b; border: 2px solid #6e451f; }
.plot.empty .plus { font-size: 26px; color: #fff; font-weight: bold; }
.plot.growing { background: #a3d977; }
.plot.ready { background: #ffe066; border: 2px solid #f5a623; }
.plot .icon { font-size: 24px; }
.plot .timer { font-size: 10px; margin-top: 2px; color: #2f4f1f; }
.plot .ready-text { font-size: 10px; margin-top: 2px; font-weight: bold; color: #a05a00; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 10; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <h1>🐝 Arı Çiftliği</h1>
  <div class="seed-bar" id="seedBar"></div>
  <div class="grid" id="grid"></div>
</div>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const CFG = window.ARI_CIFTLIK || null;
const grid = document.getElementById('grid');
const seedBar = document.getElementById('seedBar');
const el = document.getElementById('toast');

let plots = [];
let tohumlar = [];
let depo = {};
let selectedSeed = 'misir';
let sunucuFarki = 0;
let acmaOnay = null;
let acmaZaman = 0;

function toast(msg) {
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function formatTime(sn) {
  const t = Math.max(0, Math.floor(sn));
  const m = Math.floor(t / 60), s = t % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function simdi() { return Date.now() + sunucuFarki; }
function kalanSn(p) { return p.bitis ? (p.bitis - simdi()) / 1000 : 0; }
function adi(id) { return (tohumlar.find(t => t.id === id) || {}).ad || id; }

async function rpc(ad, body) {
  if (!CFG) throw new Error('Oturum yok, uygulamadan tekrar gir');
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + ad, {
    method: 'POST',
    headers: {
      'apikey': CFG.anon,
      'Authorization': 'Bearer ' + CFG.token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body || {})
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Hata ' + r.status));
  return j;
}

async function yenile() {
  const d = await rpc('ciftlik_durumu');
  sunucuFarki = d.sunucu_ms - Date.now();
  plots = d.tarlalar;
  tohumlar = d.tohumlar;
  depo = d.depo || {};
  renderSeedBar();
  renderGrid();
  renderDepo();
}

function renderSeedBar() {
  seedBar.innerHTML = '';
  tohumlar.forEach(t => {
    const b = document.createElement('div');
    b.className = 'seed-btn' + (t.id === selectedSeed ? ' active' : '');
    b.innerHTML = '<span class="icon">' + t.emoji + '</span>' + t.ad;
    b.onclick = () => { selectedSeed = t.id; renderSeedBar(); };
    seedBar.appendChild(b);
  });
}

function renderGrid() {
  grid.innerHTML = '';
  plots.forEach(p => {
    const c = document.createElement('div');
    const sinif = { kilitli: 'locked', bos: 'empty', buyuyor: 'growing', hazir: 'ready' }[p.durum];
    c.className = 'plot ' + sinif;
    if (p.durum === 'kilitli') {
      c.innerHTML = '<div class="icon lock">🔒</div><div class="timer">' + p.maliyet + ' 🪙</div>';
    } else if (p.durum === 'bos') {
      c.innerHTML = '<div class="icon plus">+</div>';
    } else if (p.durum === 'buyuyor') {
      c.innerHTML = '<div class="icon">' + p.emoji + '</div><div class="timer">' + formatTime(kalanSn(p)) + '</div>';
    } else {
      c.innerHTML = '<div class="icon">' + p.emoji + '</div><div class="ready-text">Hazır</div>';
    }
    c.onclick = () => tikla(p);
    grid.appendChild(c);
  });
}

function renderDepo() {
  let dv = document.getElementById('depo');
  if (!dv) {
    dv = document.createElement('div');
    dv.id = 'depo';
    dv.style.cssText = 'text-align:center;font-size:13px;padding:4px 8px;color:#2f4f1f;';
    grid.parentNode.insertBefore(dv, grid);
  }
  const satirlar = Object.entries(depo).map(([k, v]) => adi(k) + ': ' + v);
  dv.textContent = satirlar.length ? 'Depo — ' + satirlar.join(' · ') : 'Depo boş';
}

async function tikla(p) {
  try {
    if (p.durum === 'kilitli') {
      // WebView içinde confirm() çalışmadığı için: bir kez dokun, 4 sn içinde tekrar dokununca açılır
      if (!(acmaOnay === p.slot && Date.now() - acmaZaman < 4000)) {
        acmaOnay = p.slot;
        acmaZaman = Date.now();
        toast('Açmak için bir kez daha dokun (' + p.maliyet + ' 🪙)');
        return;
      }
      acmaOnay = null;
      await rpc('ciftlik_tarla_ac', { p_slot: p.slot });
      toast('Tarla açıldı');
    } else if (p.durum === 'bos') {
      await rpc('ciftlik_ek', { p_slot: p.slot, p_tohum: selectedSeed });
      toast(adi(selectedSeed) + ' ekildi');
    } else if (p.durum === 'buyuyor') {
      toast('Kalan süre ' + formatTime(kalanSn(p)));
      return;
    } else if (p.durum === 'hazir') {
      const s = await rpc('ciftlik_hasat', { p_slot: p.slot });
      toast(adi(s.urun) + ' +' + s.adet);
    }
  } catch (e) {
    toast(e.message);
  }
  yenile().catch(() => {});
}

yenile().catch(e => toast(e.message));

// Her saniye zamanlayıcıları günceller, süre dolunca sunucudan yeniden çeker
setInterval(() => {
  if (plots.some(p => p.durum === 'buyuyor' && kalanSn(p) <= 0)) {
    yenile().catch(() => {});
  } else {
    renderGrid();
  }
}, 1000);
</script>
</body>
</html>
