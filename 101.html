<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>101</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#16110b;color:#fff0cf;font-family:-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
#app{padding:12px}
h2{margin:6px 0 10px;text-align:center;font-size:18px;color:#f6b422}
.kart{background:#241c12;border:1px solid #3a2e1c;border-radius:14px;padding:12px;margin-bottom:10px}
.btn{background:#f6b422;color:#1b1408;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;margin:4px 4px 4px 0;cursor:pointer}
.btn.ikincil{background:transparent;color:#fff0cf;border:1px solid #3a2e1c}
.btn.tehlike{background:transparent;color:#e8743b;border:1px solid #e8743b}
.btn:disabled{opacity:.45}
.muted{color:#b9a57e;font-size:12px}
.satir{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #3a2e1c}
.satir:last-child{border-bottom:0}
.grow{flex:1}
.el{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0;min-height:80px}
.kagit{width:54px;height:76px;background:#fff;color:#1b1408;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 4px rgba(0,0,0,.4);border:2px solid transparent;user-select:none}
.kagit.kirmizi{color:#c62828}
.kagit .r{font-size:18px}
.kagit .s{font-size:16px}
.kagit.secilebilir{border-color:#f6b422;cursor:pointer}
.yerde{display:flex;justify-content:space-around;align-items:center;margin:8px 0;text-align:center}
.yerde .alinabilir{border-radius:10px;padding:4px;border:2px dashed transparent}
.yerde .alinabilir.acik{border-color:#f6b422;cursor:pointer}
#hata{color:#e8743b;font-size:13px;min-height:18px;text-align:center}
#bilgi{color:#6fe08a;font-size:13px;min-height:18px;text-align:center;font-weight:700}
.gizle{display:none}
</style>
</head>
<body>
<div id="app">
  <h2>🃏 101</h2>
  <div id="lobi">
    <div class="kart">
      <div class="muted">Bu odadaki masalar</div>
      <div id="masalar"></div>
      <div style="margin-top:8px">
        <button class="btn" onclick="masaAc(2)">2 kişilik aç</button>
        <button class="btn" onclick="masaAc(3)">3 kişilik aç</button>
        <button class="btn" onclick="masaAc(4)">4 kişilik aç</button>
      </div>
    </div>
  </div>
  <div id="masa" class="gizle">
    <div class="kart">
      <div id="baslik"></div>
      <div id="oyuncular"></div>
      <div id="aksiyon" style="margin-top:8px"></div>
    </div>
    <div class="kart">
      <div class="yerde">
        <div><div class="muted">Deste</div><div id="deste"></div></div>
        <div><div class="muted">Yerdeki kart (almak için dokun)</div><div id="yerdeKart" class="alinabilir"></div></div>
      </div>
    </div>
    <div class="kart">
      <div class="muted" style="text-align:center">Elin <span id="puan"></span></div>
      <div class="el" id="el"></div>
      <div class="muted" id="ipucu" style="text-align:center"></div>
    </div>
    <div class="kart">
      <button class="btn ikincil" onclick="lobiyeDon()">← Masalara dön</button>
      <button class="btn tehlike" onclick="ayrilOyun()">Oyundan ayrıl</button>
    </div>
  </div>
  <div id="bilgi"></div>
  <div id="hata"></div>
</div>

}
